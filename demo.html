const FT={work:ls.get('ftWork',25),rest:5,phase:'work',left:ls.get('ftWork',25)*60,running:false,iv:null,task:''};
function fmtT(s){return pad(Math.floor(s/60))+':'+pad(s%60);}
function focusCard(tasks){
  const sessions=ls.get('ft_'+todayStr(),0);
  return `<div class="card ft"><h3>🎯 Odak zamanlayıcı<span class="r">Bugün: ${sessions} seans</span></h3>
    <select class="sel" id="ftTask" style="font-size:13px"><option value="">Görev seç (isteğe bağlı)</option>${tasks.map(t=>`<option value="${h(t.title)}" ${FT.task===t.title?'selected':''}>${h(t.title)}</option>`).join('')}</select>
    <div class="ph" id="ftPh" style="margin-top:12px">${FT.phase==='work'?'Odak':'Mola'}</div>
    <div class="tm" id="ftTm">${fmtT(FT.left)}</div>
    <div class="row" style="justify-content:center">
      <div class="seg">${[25,50].map(m=>`<button class="${FT.work===m?'on':''}" data-act="ftMode" data-m="${m}">${m} dk</button>`).join('')}</div>
      <button class="btn pri" data-act="ftStart" id="ftBtn">${FT.running?'Duraklat':'Başlat'}</button>
      <button class="btn" data-act="ftReset">Sıfırla</button>
    </div></div>`;
}
function ftTick(){
  FT.left--;
  if(FT.left<=0){
    beep();
    if(FT.phase==='work'){
      ls.set('ft_'+todayStr(),ls.get('ft_'+todayStr(),0)+1);
      FT.phase='rest';FT.left=(FT.work===50?10:5)*60;toast('🎉 Odak seansı bitti! Mola zamanı.');
    }else{FT.phase='work';FT.left=FT.work*60;toast('⏱ Mola bitti, devam!');}
    if(UI.view==='today')render();
  }
  const tm=$('#ftTm');if(tm)tm.textContent=fmtT(FT.left);
  const ph=$('#ftPh');if(ph)ph.textContent=FT.phase==='work'?'Odak':'Mola';
  document.title=FT.running?fmtT(FT.left)+' · '+(FT.phase==='work'?'Odak':'Mola'):'Planner';
}
function beep(){
  try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.2,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.2);o.start(a.currentTime+t);o.stop(a.currentTime+t+.2);});}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}
}

/* ================= TAKVİM ================= */
function renderCalendar(){
  const t=todayStr();
  if(!UI.calM)UI.calM=t.slice(0,7);
  const [y,m]=UI.calM.split('-').map(Number);
  const first=`${y}-${pad(m)}-01`;
  const startOff=(dow(first)+6)%7;
  const start=addDays(first,-startOff);
  const byDate={};
  S.tasks.forEach(x=>{if(x.date)(byDate[x.date]=byDate[x.date]||[]).push(x);});
  let cells='';
  for(let i=0;i<42;i++){
    const d=addDays(start,i);
    if(i>=35&&d.slice(0,7)!==UI.calM)break;
    const arr=(byDate[d]||[]).sort((a,b)=>a.done-b.done||sortT(a,b));
    const cls=[d.slice(0,7)!==UI.calM?'out':'',d===t?'today':'',d===UI.selDay?'picked':''].join(' ');
    cells+=`<button class="cell ${cls}" data-act="day" data-d="${d}"><span class="d">${+d.slice(8)}</span>
      ${arr.slice(0,3).map(x=>`<span class="cchip ${x.done?'done':''} ${x.priority===1&&!x.done?'p1':''}">${x.time?x.time+' ':''}${h(x.title)}</span>`).join('')}
      ${arr.length>3?`<span class="more">+${arr.length-3} daha</span>`:''}
      <span class="dots">${arr.slice(0,4).map(x=>`<i class="${x.done?'done':''} ${x.priority===1?'p1':''}"></i>`).join('')}</span></button>`;
  }
  const sel=(byDate[UI.selDay]||[]).sort((a,b)=>a.done-b.done||sortT(a,b));
  return header('Takvim')+`
   <div class="cols"><div>
    <div class="calhead"><h2>${AY[m-1]} ${y}</h2>
      <button class="iconbtn" data-act="calNav" data-n="-1">‹</button><button class="btn sm" data-act="calToday">Bugün</button><button class="iconbtn" data-act="calNav" data-n="1">›</button></div>
    <div class="cal">${['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(x=>`<div class="dn">${x}</div>`).join('')}${cells}</div>
   </div><div>
    <div class="card"><h3>${fmtLong(UI.selDay)}</h3>
      ${sel.length?list(sel,{noDate:true}):'<div class="empty"><b>📭</b>Bu gün için görev yok.</div>'}
      <button class="btn pri" style="width:100%;margin-top:6px" data-act="new" data-d="${UI.selDay}">+ Bu güne görev ekle</button>
    </div>
   </div></div>`;
}

/* ================= GÖREVLER ================= */
function renderTasks(){
  const f=UI.f,t=todayStr();
  let arr=S.tasks.slice();
  if(f.status==='open')arr=arr.filter(x=>!x.done);
  if(f.status==='done')arr=arr.filter(x=>x.done);
  if(f.cat)arr=arr.filter(x=>(x.category||'')===(f.cat==='-'?'':f.cat));
  if(f.prio)arr=arr.filter(x=>String(x.priority)===f.prio);
  if(f.q){const q=f.q.toLocaleLowerCase('tr');arr=arr.filter(x=>(x.title+' '+x.notes+' '+x.category).toLocaleLowerCase('tr').includes(q));}
  let body='';
  if(f.status==='done'){
    arr.sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||''));
    body=arr.length?list(arr):'<div class="empty"><b>🗂</b>Tamamlanan görev yok.</div>';
  }else{
    arr.sort(sortT);
    const g={over:[],today:[],tom:[],week:[],later:[],none:[],done:[]};
    arr.forEach(x=>{
      if(x.done)return g.done.push(x);
      if(!x.date)return g.none.push(x);
      const d=diff(t,x.date);
      if(d<0)g.over.push(x);else if(d===0)g.today.push(x);else if(d===1)g.tom.push(x);else if(d<=7)g.week.push(x);else g.later.push(x);
    });
    body=section('Gecikenler',g.over,'red')+section('Bugün',g.today,'',{noDate:true})+section('Yarın',g.tom,'',{noDate:true})+section('Bu hafta',g.week)+section('Daha sonra',g.later)+section('Tarihsiz',g.none)+section('Tamamlanan',g.done);
    if(!arr.length)body='<div class="empty"><b>🔍</b>Görev bulunamadı.</div>';
  }
  const cats=S.settings.categories||[];
  return header('Görevler',`${open().length} açık görev`)+quickAdd()+`
    <div class="filters">
      <input class="inp auto" style="flex:1;min-width:160px" id="fq" placeholder="🔍 Ara…" value="${h(f.q)}">
      <div class="seg">${[['open','Açık'],['done','Biten'],['all','Tümü']].map(([k,l])=>`<button class="${f.status===k?'on':''}" data-act="fStatus" data-v="${k}">${l}</button>`).join('')}</div>
      <select class="sel auto" id="fcat"><option value="">Tüm kategoriler</option>${cats.map(c=>`<option ${f.cat===c?'selected':''}>${h(c)}</option>`).join('')}<option value="-" ${f.cat==='-'?'selected':''}>Kategorisiz</option></select>
      <select class="sel auto" id="fprio"><option value="">Tüm öncelikler</option><option value="1" ${f.prio==='1'?'selected':''}>🔴 Yüksek</option><option value="2" ${f.prio==='2'?'selected':''}>🟡 Orta</option><option value="3" ${f.prio==='3'?'selected':''}>⚪ Düşük</option></select>
    </div>${body}`;
}

/* ================= ALIŞKANLIKLAR ================= */
function streak(hb){
  const t=todayStr();let d=hb.log.includes(t)?t:addDays(t,-1);let n=0,guard=0;
  while(guard++<400){
    if(!hb.days.includes(String(dow(d)))){d=addDays(d,-1);continue;}
    if(hb.log.includes(d)){n++;d=addDays(d,-1);}else break;
  }
  return n;
}
function renderHabits(){
  const t=todayStr();
  const cards=S.habits.map(hb=>{
    const week=[];for(let i=6;i>=0;i--)week.push(addDays(t,-i));
    const heat=[];for(let i=29;i>=0;i--)heat.push(addDays(t,-i));
    const planned=heat.filter(d=>hb.days.includes(String(dow(d)))).length;
    const hit=heat.filter(d=>hb.log.includes(d)).length;
    const st=streak(hb);
    return `<div class="card"><div class="habit"><div class="em">${h(hb.emoji)}</div>
      <div><div class="nm">${h(hb.name)}</div><div class="st">🔥 ${st} gün seri · Son 30 gün: %${planned?Math.round(100*hit/planned):0} · ${hb.days.length===7?'Her gün':hb.days.split('').map(x=>GK[x]).join(', ')}</div></div>
      <button class="btn sm" data-act="editHabit" data-id="${hb.id}">Düzenle</button></div>
      <div class="week">${week.map(d=>{const plan=hb.days.includes(String(dow(d)));const on=hb.log.includes(d);
        return `<div class="wd">${GK[dow(d)]}<button class="${on?'on':''} ${!plan&&!on?'off':''} ${d===t?'today':''}" data-act="habit" data-id="${hb.id}" data-d="${d}">${on?'✓':+d.slice(8)}</button></div>`;}).join('')}</div>
      <div class="heat" title="Son 30 gün">${heat.map(d=>`<i class="${hb.log.includes(d)?'on':''} ${hb.days.includes(String(dow(d)))?'':'na'}" title="${fmtShort(d)}"></i>`).join('')}</div>
    </div>`;
  }).join('');
  return header('Alışkanlıklar','Küçük adımlar, büyük seriler',`<button class="btn pri" data-act="editHabit">+ Yeni</button>`)+
    (cards||`<div class="card empty"><b>🌱</b>İlk alışkanlığını ekle: su içmek, kitap okumak, spor…<br><br><button class="btn pri" data-act="editHabit">+ Alışkanlık ekle</button></div>`);
}

/* ================= İSTATİSTİK ================= */
function renderStats(){
  const t=todayStr();
  const done=S.tasks.filter(x=>x.done&&x.doneAt);
  const dDate=x=>x.doneAt.slice(0,10);
  const wk=addDays(t,-6);
  const doneWeek=done.filter(x=>dDate(x)>=wk);
  const dueWeek=S.tasks.filter(x=>x.date&&x.date>=wk&&x.date<=t);
  const rate=dueWeek.length?Math.round(100*dueWeek.filter(x=>x.done).length/dueWeek.length):0;
  let st=0,d=done.some(x=>dDate(x)===t)?t:addDays(t,-1);
  while(done.some(x=>dDate(x)===d)){st++;d=addDays(d,-1);}
  const days=[];for(let i=13;i>=0;i--)days.push(addDays(t,-i));
  const counts=days.map(dd=>done.filter(x=>dDate(x)===dd).length);
  const max=Math.max(1,...counts);
  const byCat={};doneWeek.forEach(x=>{const k=x.category||'Diğer';byCat[k]=(byCat[k]||0)+1;});
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const cmax=Math.max(1,...cats.map(c=>c[1]));
  const habitsRows=S.habits.map(hb=>{let p=0,hit=0;for(let i=0;i<7;i++){const dd=addDays(t,-i);if(hb.days.includes(String(dow(dd)))){p++;if(hb.log.includes(dd))hit++;}}return [hb,p?Math.round(100*hit/p):0];});
  return header('İstatistik','Son 7 gün ve genel görünüm')+`
    <div class="grid4">
      <div class="kpi"><b>${doneWeek.length}</b><span>Bu hafta tamamlanan</span></div>
      <div class="kpi"><b>%${rate}</b><span>Zamanında bitirme</span></div>
      <div class="kpi"><b>${st} 🔥</b><span>Üretken gün serisi</span></div>
      <div class="kpi"><b>${open().length}</b><span>Açık görev (${overdueCount()} geciken)</span></div>
    </div>
    <div class="cols" style="margin-top:18px"><div>
      <div class="card"><h3>📈 Son 14 gün tamamlanan</h3>
        <div class="bars">${counts.map((c,i)=>`<div class="bar"><em>${c||''}</em><i class="${c?'':'zero'}" style="height:${Math.max(3,Math.round(110*c/max))}px"></i><small>${i%2===1||days.length<10?GK[dow(days[i])]:''}</small></div>`).join('')}</div></div>
      <div class="card"><h3>🏷 Bu hafta kategoriler</h3>
        ${cats.length?cats.map(([k,v])=>`<div class="hbar"><span>${h(k)}</span><div class="tr"><i style="width:${Math.round(100*v/cmax)}%;background:${catColor(k)}"></i></div><b>${v}</b></div>`).join(''):'<div class="empty">Bu hafta henüz tamamlanan görev yok.</div>'}
      </div>
      ${habitsRows.length?`<div class="card"><h3>🔁 Alışkanlıklar (7 gün)</h3>${habitsRows.map(([hb,p])=>`<div class="hbar"><span>${h(hb.emoji)} ${h(hb.name)}</span><div class="tr"><i style="width:${p}%;background:var(--green)"></i></div><b>%${p}</b></div>`).join('')}</div>`:''}
    </div><div>
      <div class="card"><h3>🤖 Haftalık değerlendirme</h3>
        <p style="margin:0 0 10px;font-size:13px;color:var(--muted)">Gemini haftanı yorumlar ve gelecek hafta için öneriler verir. Her ${GUN[S.settings.weeklyDay||0]} Telegram’a da gönderilir.</p>
        ${S.settings.geminiSet?`<button class="btn ai" data-act="aiWeekly" ${UI.aiWeeklyBusy?'disabled':''}>${UI.aiWeeklyBusy?'<span class="spin"></span> Hazırlanıyor…':'✨ Değerlendir'}</button>`:'<p style="font-size:13px;color:var(--muted)">Önce Ayarlar’dan Gemini anahtarını ekle.</p>'}
        ${UI.aiWeekly?`<div class="ai-out">${h(UI.aiWeekly)}</div>`:''}
      </div>
    </div></div>`;
}

/* ================= konfeti ================= */
const CF={parts:[],run:false,cv:null,ctx:null};
function confetti(x,y,n){
  try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(e){}
  if(!CF.cv){CF.cv=document.createElement('canvas');CF.cv.id='confetti';document.body.appendChild(CF.cv);CF.ctx=CF.cv.getContext('2d');}
  const dpr=window.devicePixelRatio||1;
  CF.cv.width=innerWidth*dpr;CF.cv.height=innerHeight*dpr;CF.cv.style.width=innerWidth+'px';CF.cv.style.height=innerHeight+'px';
  const cols=['#6c4cff','#b44cff','#ff5fa2','#33c6ff','#ffbd4a','#34d399'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=3+Math.random()*(n>60?11:7);
    CF.parts.push({x:x*dpr,y:y*dpr,vx:Math.cos(a)*sp*dpr,vy:(Math.sin(a)*sp-5)*dpr,s:(5+Math.random()*5)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length],t:0,max:70+Math.random()*40,round:Math.random()<.35});}
  if(CF.run)return;CF.run=true;
  (function tick(){
    const c=CF.ctx;c.clearRect(0,0,CF.cv.width,CF.cv.height);
    CF.parts=CF.parts.filter(p=>p.t<p.max);
    CF.parts.forEach(p=>{p.t++;p.vy+=.32*dpr;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      c.save();c.translate(p.x,p.y);c.rotate(p.r);c.globalAlpha=Math.max(0,1-p.t/p.max);c.fillStyle=p.c;
      if(p.round){c.beginPath();c.arc(0,0,p.s/2.4,0,7);c.fill();}else c.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);c.restore();});
    if(CF.parts.length)requestAnimationFrame(tick);else{CF.run=false;c.clearRect(0,0,CF.cv.width,CF.cv.height);}
  })();
}

function render(){
  const v=UI.view;
  const oc=overdueCount()+open().filter(x=>x.date===todayStr()).length;
  $('#sidenav').innerHTML=VIEWS.map(([k,l,ic])=>`<button class="nav ${v===k?'on':''}" data-act="go" data-v="${k}">${ic}<span>${l}</span>${k==='today'&&oc?`<span class="cnt">${oc}</span>`:''}</button>`).join('');

  const fq=document.activeElement&&document.activeElement.id==='fq'?{pos:document.activeElement.selectionStart}:null;
  const map={today:renderToday,calendar:renderCalendar,tasks:renderTasks,habits:renderHabits,stats:renderStats,settings:renderSettings};

/* ================= olaylar ================= */
async function withBusy(btn,fn){
  const old=btn?btn.innerHTML:'';
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span>';}
  try{return await fn();}catch(e){}finally{if(btn&&document.body.contains(btn)){btn.disabled=false;btn.innerHTML=old;}}
}
function settingsPayload(){
  return{name:$('#sName').value,morningHour:+$('#sMorning').value,eveningHour:+$('#sEvening').value,weeklyDay:+$('#sWDay').value,
    weeklyHour:+$('#sWHour').value,remindMin:+$('#sRemind').value,aiInBrief:$('#sAi').checked,webAppUrl:$('#sUrl').value,siteUrl:$('#sSite').value,categories:S.settings.categories};
}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='modal')closeModal();return;}
  const a=el.dataset.act,id=el.dataset.id;
  if(el.tagName==='A'||a!=='edit')e.preventDefault();
  e.stopPropagation();
  switch(a){
    case 'go':UI.anim=true;UI.view=el.dataset.v;ls.set('view',UI.view);closeModal();render();window.scrollTo(0,0);break;
    case 'theme':toggleTheme();render();break;
    case 'refresh':withBusy(el,()=>run('load'));break;
    case 'new':openTask(null,{date:el.dataset.d!==undefined?el.dataset.d:(UI.view==='today'?todayStr():UI.view==='calendar'?UI.selDay:'')});break;
    case 'edit':{const t=S.tasks.find(x=>x.id===id);if(t)openTask(t);break;}
    case 'toggle':{
      const t=S.tasks.find(x=>x.id===id);if(!t)break;
      const rc=el.getBoundingClientRect();
      t.done=!t.done;t.doneAt=t.done?new Date().toISOString().slice(0,19):'';
      if(t.done){
        confetti(rc.left+rc.width/2,rc.top+rc.height/2,28);
        const td=todayStr(),left=open().filter(x=>x.date&&x.date<=td).length;
        if(left===0&&(t.date||'')<=td&&t.date){setTimeout(()=>confetti(innerWidth/2,innerHeight*.35,160),250);toast('🎉 Bugünün tüm işleri bitti, harikasın!');}
        else toast(t.repeat?'✅ Tamamlandı — sıradaki tekrar oluşturuluyor':'✅ Tamamlandı');
      }
      render();run('toggleTask',{id,done:t.done}).catch(()=>run('load'));break;}
    case 'showDone':UI.showDone=!UI.showDone;render();break;
    case 'moveUndone':withBusy(el,async()=>{const r=await run('moveUndone');toast('➡️ '+r.count+' görev yarına taşındı');});break;
    case 'habit':{
      const hb=S.habits.find(x=>x.id===id),d=el.dataset.d;if(!hb)break;
      const i=hb.log.indexOf(d);if(i>=0)hb.log.splice(i,1);else{hb.log.push(d);const rc=el.getBoundingClientRect();confetti(rc.left+rc.width/2,rc.top+rc.height/2,18);if(d===todayStr())toast('🔥 Harika, devam!');}
      render();run('toggleHabit',{id,date:d}).catch(()=>run('load'));break;}
    case 'aiPlan':
      UI.aiPlanBusy=true;render();
      try{const r=await api('aiPlan');UI.aiPlan=r.text;}catch(err){toast(err.message||String(err),'err');}
      UI.aiPlanBusy=false;render();break;
    case 'aiWeekly':
      UI.aiWeeklyBusy=true;render();
      try{const r=await api('aiWeekly');UI.aiWeekly=r.text;}catch(err){toast(err.message||String(err),'err');}
      UI.aiWeeklyBusy=false;render();break;

    /* takvim */
    case 'calNav':{const [y,m]=UI.calM.split('-').map(Number);const d=new Date(Date.UTC(y,m-1+(+el.dataset.n),1));UI.calM=d.toISOString().slice(0,7);render();break;}
    case 'calToday':UI.calM=todayStr().slice(0,7);UI.selDay=todayStr();render();break;
    case 'day':UI.selDay=el.dataset.d;if(UI.selDay.slice(0,7)!==UI.calM)UI.calM=UI.selDay.slice(0,7);render();break;

    /* filtreler */
    case 'fStatus':UI.f.status=el.dataset.v;render();break;

    /* modal: görev */
    case 'close':closeModal();break;
    case 'eDate':$('#eDate').value=el.dataset.d;if(!el.dataset.d)$('#eTime').value='';break;
    case 'ePrio':UI.edit.priority=+el.dataset.p;document.querySelectorAll('#ePrio button').forEach(b=>b.classList.toggle('on',+b.dataset.p===UI.edit.priority));break;
    case 'subChk':readEdit();UI.edit.subtasks[+el.dataset.i].d=!UI.edit.subtasks[+el.dataset.i].d;renderSubs();break;
    case 'subDel':readEdit();UI.edit.subtasks.splice(+el.dataset.i,1);renderSubs();break;
    case 'saveTask':{
      const d=readEdit();if(!d.title.trim()){toast('Başlık yaz','err');$('#eTitle').focus();break;}
      await withBusy(el,async()=>{await run('saveTask',d);closeModal();toast(d.id?'💾 Kaydedildi':'➕ Eklendi');});break;}
    case 'delTask':
      if(!UI.edit.delArm){UI.edit.delArm=true;el.textContent='Emin misin?';break;}
      await withBusy(el,async()=>{await run('deleteTask',{id:UI.edit.id});closeModal();toast('🗑 Silindi');});break;
    case 'aiBreak':{
      const d=readEdit();if(!d.title.trim()){toast('Önce görevi yaz','err');break;}
      if(!S.settings.geminiSet){toast('Önce Ayarlar’dan Gemini anahtarını ekle','err');break;}
      UI.edit.aiBusy=true;renderAi();
      try{const r=await api('aiBreakdown',{title:d.title,notes:d.notes,date:d.date});if(UI.edit)UI.edit.ai=r.result;}catch(err){toast(err.message||String(err),'err');}
      if(UI.edit){UI.edit.aiBusy=false;renderAi();}break;}
    case 'aiAsSubs':readEdit();aiSelected().forEach(s=>UI.edit.subtasks.push({t:s.title,d:false,date:s.date}));UI.edit.ai=null;renderSubs();renderAi();toast('Alt adımlar eklendi — kaydetmeyi unutma');break;
    case 'aiAsTasks':{
      const d=readEdit();const sel=aiSelected();
      const tasks=sel.map(s=>({title:s.title,date:s.date,category:d.category,priority:d.priority,notes:'↳ '+d.title}));
      await withBusy(el,async()=>{await run('addMany',{tasks});UI.edit.ai=null;renderAi();toast('➕ '+tasks.length+' görev eklendi');});break;}

    /* alışkanlık modal */
    case 'editHabit':habitModal(S.habits.find(x=>x.id===id));break;
    case 'hEmoji':UI.hemoji=el.dataset.e;document.querySelectorAll('#hEmo button').forEach(b=>b.classList.toggle('on',b.dataset.e===UI.hemoji));break;
    case 'hDay':{const d=el.dataset.d;UI.hdays=UI.hdays.includes(d)?UI.hdays.replace(d,''):UI.hdays+d;el.classList.toggle('on');break;}
    case 'saveHabit':{
      const name=$('#hName').value.trim();if(!name){toast('Ad yaz','err');break;}
      if(!UI.hdays){toast('En az bir gün seç','err');break;}
      await withBusy(el,async()=>{await run('saveHabit',{id:id||'',name,emoji:UI.hemoji,days:UI.hdays.split('').sort().join('')});closeModal();});break;}
    case 'delHabit':
      if(el.dataset.arm!=='1'){el.dataset.arm='1';el.textContent='Emin misin?';break;}
      await withBusy(el,async()=>{await run('deleteHabit',{id});closeModal();});break;

    /* odak */
    case 'ftStart':
      FT.running=!FT.running;
      if(FT.running){FT.task=($('#ftTask')||{}).value||'';FT.iv=setInterval(ftTick,1000);}else{clearInterval(FT.iv);document.title='Planner';}
      el.textContent=FT.running?'Duraklat':'Başlat';break;
    case 'ftReset':clearInterval(FT.iv);FT.running=false;FT.phase='work';FT.left=FT.work*60;document.title='Planner';render();break;
    case 'ftMode':if(FT.running)break;FT.work=+el.dataset.m;ls.set('ftWork',FT.work);FT.phase='work';FT.left=FT.work*60;render();break;

    /* ayarlar */
    case 'saveSettings':await withBusy(el,()=>run('saveSettings',settingsPayload(),'💾 Ayarlar kaydedildi'));break;
    case 'delCat':S.settings.categories.splice(+el.dataset.i,1);render();run('saveSettings',{categories:S.settings.categories});break;
    case 'tgSave':{const v=$('#sTg').value.trim();if(!v){toast('Token gir','err');break;}
      if(!/^\d+:[\w-]{20,}$/.test(v)){toast('Bu bir bot token’ına benzemiyor','err');break;}
      await withBusy(el,()=>run('saveSettings',Object.assign(settingsPayload(),{tgToken:v}),'💾 Token kaydedildi — şimdi botuna /start yaz ve Bağla’ya bas'));break;}
    case 'tgConnect':await withBusy(el,async()=>{const r=await run('tgConnect');toast('✅ Bağlandı'+(r.result.name?': '+r.result.name:''));});break;
    case 'tgTest':await withBusy(el,()=>run('tgTest',null,'📨 Gönderildi, Telegram’ı kontrol et'));break;
    case 'tgBrief':await withBusy(el,()=>run('tgBrief',null,'📨 Sabah özeti gönderildi'));break;
    case 'tgStatus':await withBusy(el,async()=>{const r=await run('tgStatus');const x=r.result;
      $('#tgInfo').innerHTML=`Webhook: <b>${x.webhook?'aktif':'yok'}</b> · Bekleyen: ${x.pending}${x.lastError?`<br>Son hata (${h(x.lastErrorDate)}): ${h(x.lastError)}<br><button class="btn sm" data-act="tgWebhook" style="margin-top:6px">Webhook’u yeniden kur</button>`:''}`;});break;
    case 'tgWebhook':await withBusy(el,()=>run('tgWebhook',null,'🔁 Webhook yeniden kuruldu'));break;
    case 'gemSave':{const k=$('#sGem').value.trim();
      await withBusy(el,()=>run('saveSettings',Object.assign(settingsPayload(),{geminiKey:k,geminiModel:$('#sModel').value}),'💾 Gemini ayarları kaydedildi'));break;}
    case 'gemClear':await withBusy(el,()=>run('saveSettings',{clearGemini:true},'Anahtar silindi'));break;
    case 'aiTest':await withBusy(el,async()=>{try{const r=await api('aiTest');$('#gemInfo').innerHTML='✅ '+h(r.text)+' <span style="color:var(--faint)">('+h(r.model)+')</span>';}catch(err){$('#gemInfo').textContent='❌ '+(err.message||err);}});break;
    case 'copyLink':{const l=appLink();try{await navigator.clipboard.writeText(l);toast('📋 Link kopyalandı');}catch(err){prompt('Linki kopyala:',l);}break;}
  }
});

document.addEventListener('submit',async e=>{
  const f=e.target.dataset.form;if(!f)return;
  e.preventDefault();
  if(f==='qa'){
    const inp=$('#qa');const text=inp.value.trim();if(!text)return;
    inp.value='';inp.disabled=true;
    try{const r=await run('quickAdd',{text});const t=r.task;
      toast('➕ '+t.title+(t.date?' · '+rel(t.date).txt:'')+(t.time?' '+t.time:''));}catch(err){inp.value=text;}
    const i2=$('#qa');if(i2){i2.disabled=false;i2.focus();}
  }
  if(f==='sub'){
    const inp=$('#eSubNew');const v=inp.value.trim();if(!v)return;
    readEdit();UI.edit.subtasks.push({t:v,d:false,date:''});inp.value='';renderSubs();inp.focus();
  }
  if(f==='cat'){
    const v=$('#newCat').value.trim();if(!v)return;
    if(!S.settings.categories.includes(v))S.settings.categories.push(v);
    await run('saveSettings',{categories:S.settings.categories},'🏷 Kategori eklendi');
  }
});

document.addEventListener('input',e=>{
  if(e.target.id==='fq'){UI.f.q=e.target.value;render();}
});
document.addEventListener('change',e=>{
  if(e.target.id==='fcat'){UI.f.cat=e.target.value;render();}
  if(e.target.id==='fprio'){UI.f.prio=e.target.value;render();}
  if(e.target.id==='ftTask'){FT.task=e.target.value;}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').classList.contains('hidden'))closeModal();
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();openTask(null,{date:UI.view==='calendar'?UI.selDay:todayStr()});}
  if(e.key==='/'){const q=$('#qa');if(q){e.preventDefault();q.focus();}}
});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme();render();});

/* gün değişince ve sekmeye dönünce yenile */
let lastDay=todayStr();
setInterval(()=>{if(todayStr()!==lastDay){lastDay=todayStr();run('load').catch(()=>{});}},60000);
document.addEventListener('visibilitychange',()=>{const ae=document.activeElement;const typing=ae&&/^(input|textarea|select)$/i.test(ae.tagName);if(document.visibilityState==='visible'&&UI.view!=='settings'&&!typing&&$('#modal').classList.contains('hidden'))api('load').then(r=>{S=r.state;render();}).catch(()=>{});});

/* başlat */
applyTheme();
run('load').catch(()=>{$('#main').innerHTML='<div class="loading">Yüklenemedi. Sayfayı yenile.</div>';});
</script>
</body>
</html>
