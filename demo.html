<!DOCTYPE html>
<html lang="tr">
<head>
<title>Planner — Canlı demo</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c4cff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ff;--glass:rgba(255,255,255,.66);--glass2:rgba(255,255,255,.55);--glass-b:rgba(255,255,255,.85);
  --card:var(--glass);--card2:var(--glass2);
  --text:#1a1730;--muted:#5f5a80;--faint:#9a95b8;--line:rgba(90,70,180,.13);
  --accent:#6c4cff;--accent2:#b44cff;--accent-soft:rgba(108,76,255,.12);
  --grad:linear-gradient(135deg,#6c4cff 0%,#b44cff 52%,#ff5fa2 100%);
  --red:#ef4565;--red-soft:rgba(239,69,101,.12);--amber:#e08a00;--amber-soft:rgba(245,158,11,.15);
  --green:#10b981;--green-soft:rgba(16,185,129,.14);
  --shadow:0 2px 6px rgba(60,30,160,.05),0 12px 36px rgba(60,30,160,.09);--r:20px;
  --blob-o:.55;
}
:root[data-theme="dark"]{
  --bg:#0a0918;--glass:rgba(32,28,62,.55);--glass2:rgba(255,255,255,.055);--glass-b:rgba(255,255,255,.09);
  --text:#f1efff;--muted:#aaa4cf;--faint:#6f6a95;--line:rgba(255,255,255,.08);
  --accent:#9580ff;--accent2:#d06bff;--accent-soft:rgba(149,128,255,.17);
  --red:#ff6b86;--red-soft:rgba(255,107,134,.15);--amber:#ffbd4a;--amber-soft:rgba(255,189,74,.14);
  --green:#34d399;--green-soft:rgba(52,211,153,.14);
  --shadow:0 2px 6px rgba(0,0,0,.25),0 14px 40px rgba(0,0,0,.35);--blob-o:.38;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--text)}
a{color:var(--accent)}
.hidden{display:none!important}
::selection{background:var(--accent-soft)}

/* hareketli arka plan */
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--blob-o);animation:float 22s ease-in-out infinite alternate}
.bgfx i:nth-child(1){width:520px;height:520px;background:#7c5cff;top:-160px;left:-120px}
.bgfx i:nth-child(2){width:460px;height:460px;background:#ff6fb5;bottom:-180px;right:-120px;animation-duration:26s}
.bgfx i:nth-child(3){width:380px;height:380px;background:#33c6ff;top:38%;left:46%;animation-duration:30s;opacity:calc(var(--blob-o)*.7)}
@keyframes float{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.12)}100%{transform:translate(-40px,70px) scale(.95)}}

.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--glass-b)}

/* yerleşim */
.app{display:flex;min-height:100vh;position:relative;z-index:1}
.side{width:248px;flex-shrink:0;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;
  background:var(--glass);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border-right:1px solid var(--glass-b)}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:20px;padding:4px 10px 22px;letter-spacing:-.02em}
.logo i{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;font-style:normal;font-size:18px;box-shadow:0 6px 18px rgba(108,76,255,.45)}
.nav{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:13px;color:var(--muted);font-weight:600;text-align:left;width:100%;transition:all .2s}
.nav:hover{background:var(--glass2);color:var(--text);transform:translateX(2px)}
.nav.on{background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(108,76,255,.35)}
.nav svg{width:20px;height:20px;flex-shrink:0}
.nav .cnt{margin-left:auto;font-size:12px;background:var(--accent);color:#fff;border-radius:20px;padding:1px 8px;font-weight:700}
.nav.on .cnt{background:rgba(255,255,255,.28)}
.side .grow{flex:1}
main{flex:1;min-width:0;padding:30px 34px 120px;max-width:1200px}
.tabbar{display:none}
.fab{position:fixed;right:28px;bottom:28px;width:60px;height:60px;border-radius:20px;background:var(--grad);color:#fff;font-size:30px;font-weight:300;
  box-shadow:0 10px 30px rgba(108,76,255,.5);display:grid;place-items:center;z-index:20;transition:transform .2s;animation:glow 3s ease-in-out infinite}
.fab:hover{transform:translateY(-3px) rotate(90deg)}
@keyframes glow{50%{box-shadow:0 10px 40px rgba(180,76,255,.65)}}

.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:22px}
.head h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.head .sub{color:var(--muted);margin-top:4px;font-size:14px}
.head .row{flex-wrap:nowrap;flex-shrink:0}
.iconbtn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:var(--muted);background:var(--glass);border:1px solid var(--glass-b);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:all .2s;font-size:17px}
.iconbtn:hover{color:var(--accent);transform:translateY(-1px)}
.iconbtn svg{width:19px;height:19px}
.mob{display:none}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.card{background:var(--glass);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--glass-b);
  border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.card+.card{margin-top:16px}
.card h3{margin:0 0 14px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.card h3 .r{margin-left:auto;font-weight:600;font-size:13px;color:var(--muted)}
.sec{margin:24px 0 10px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sec .n{background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:2px 9px;font-size:11px}
.sec.red{color:var(--red)} .sec.red .n{background:var(--red-soft);color:var(--red)}
.empty{padding:28px 10px;text-align:center;color:var(--faint);font-size:14px}
.empty b{display:block;font-size:34px;margin-bottom:8px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}

/* hızlı ekle */
.qa{display:flex;gap:8px;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1.5px solid var(--glass-b);border-radius:18px;
  padding:7px 7px 7px 16px;align-items:center;box-shadow:var(--shadow);transition:all .2s}
.qa:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow)}
.qa input{flex:1;border:0;outline:0;background:none;padding:9px 0;font-size:15px;min-width:0}
.qa input::placeholder{color:var(--faint)}
.btn{padding:10px 17px;border-radius:13px;font-weight:700;font-size:14px;background:var(--glass2);border:1px solid var(--line);white-space:nowrap;transition:all .2s}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.btn.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(108,76,255,.35)}
.btn.pri:hover{color:#fff;box-shadow:0 10px 26px rgba(108,76,255,.5)}
.btn.danger{color:var(--red)} .btn.danger:hover{border-color:var(--red)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn.ai{background:linear-gradient(120deg,#4285f4,#9b72cb,#d96570,#9b72cb,#4285f4);background-size:300% 100%;color:#fff;border:0;animation:shine 6s linear infinite;box-shadow:0 6px 20px rgba(155,114,203,.4)}
.btn.ai:hover{color:#fff}
@keyframes shine{to{background-position:300% 0}}
a.btn{text-decoration:none;display:inline-block;color:var(--text)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* görev */
.task{position:relative;display:flex;gap:13px;align-items:flex-start;background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--glass-b);border-radius:16px;padding:14px 16px;margin-bottom:9px;cursor:pointer;transition:transform .18s,box-shadow .18s,opacity .3s;box-shadow:0 2px 10px rgba(60,30,160,.04);overflow:hidden}
.task:before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--faint);opacity:.5}
.task.p1:before{background:var(--red);opacity:1} .task.p2:before{background:var(--amber);opacity:.9}
.task:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.task.done{opacity:.62} .task.done:before{background:var(--green)}
.task.done .tt{text-decoration:line-through;color:var(--faint)}
.chk{width:24px;height:24px;border-radius:50%;border:2.2px solid var(--faint);flex-shrink:0;display:grid;place-items:center;margin-top:0;transition:all .2s;color:#fff;background:transparent}
.chk svg{width:13px;height:13px;opacity:0;transform:scale(.4);transition:all .2s}
.chk.p1{border-color:var(--red)} .chk.p2{border-color:var(--amber)}
.chk:hover{background:var(--accent-soft)} .chk:hover svg{opacity:.6;transform:scale(1);color:var(--accent)}
.task.done .chk{background:linear-gradient(135deg,#10b981,#34d399);border-color:transparent;animation:pop .35s} .task.done .chk svg{opacity:1;transform:scale(1);color:#fff}
@keyframes pop{40%{transform:scale(1.3)}}
.tb{flex:1;min-width:0}
.tt{font-weight:600;line-height:1.38;word-wrap:break-word}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;font-size:12px;color:var(--muted);align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;background:var(--glass2);border:1px solid var(--line);font-weight:600;white-space:nowrap}
.pill.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.pill.amber{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.green{background:var(--green-soft);color:var(--green);border-color:transparent}
.cat{padding:3px 9px;border-radius:20px;font-weight:700}
.prog{height:5px;border-radius:5px;background:var(--line);margin-top:9px;overflow:hidden;max-width:200px}
.prog i{display:block;height:100%;background:var(--grad);border-radius:5px;transition:width .4s}

/* bugün kahraman kartı */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:20px;background:linear-gradient(120deg,#5b3cff,#a63cff,#ff4f9a,#a63cff,#5b3cff);background-size:300% 100%;
  animation:shine 14s linear infinite;color:#fff;border-radius:24px;padding:24px 26px;margin-bottom:20px;box-shadow:0 16px 40px rgba(108,76,255,.35)}
.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12);right:-70px;top:-110px}
.hero:before{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08);right:140px;bottom:-100px}
.hero>*{position:relative;z-index:1}
.hero h2{margin:0;font-size:23px;font-weight:800;letter-spacing:-.02em}
.hero p{margin:5px 0 0;opacity:.9;font-size:14px;font-weight:500}
.ring{width:70px;height:70px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring circle{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:800}
.hero .stats{margin-left:auto;display:flex;gap:10px;text-align:center}
.hero .stats>div{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:10px 14px;min-width:70px;backdrop-filter:blur(6px)}
.hero .stats b{display:block;font-size:22px;font-weight:800}
.hero .stats span{font-size:12px;opacity:.9;font-weight:600}

.ai-out{white-space:pre-wrap;line-height:1.6;font-size:14px;background:linear-gradient(135deg,rgba(66,133,244,.08),rgba(217,101,112,.08));border-radius:14px;padding:14px 16px;border:1px solid var(--line);margin-top:12px;animation:up .4s both}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* alışkanlıklar */
.hchips{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:14px;border:1.5px solid var(--line);background:var(--glass2);font-weight:600;font-size:14px;transition:all .2s}
.hchip:hover{transform:translateY(-1px);border-color:var(--green)}
.hchip.on{background:linear-gradient(135deg,#10b981,#34d399);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(16,185,129,.35)}
.habit{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.habit .em{font-size:28px;width:54px;height:54px;border-radius:17px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 20px rgba(108,76,255,.3)}
.habit .nm{font-weight:800;font-size:16px}
.habit .st{font-size:13px;color:var(--muted);margin-top:3px}
.week{display:flex;gap:6px;margin-top:16px}
.wd{flex:1;text-align:center;font-size:11px;color:var(--muted);font-weight:600}
.wd button{width:100%;max-width:44px;aspect-ratio:1;border-radius:13px;border:1.5px solid var(--line);display:grid;place-items:center;margin:5px auto 0;font-weight:700;font-size:13px;background:var(--glass2);transition:all .2s}
.wd button:hover{border-color:var(--green)}
.wd button.on{background:linear-gradient(135deg,#10b981,#34d399);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(16,185,129,.35)}
.wd button.off{opacity:.35;cursor:default}
.wd button.today{border-color:var(--accent);border-width:2px}
.heat{display:grid;grid-template-columns:repeat(30,1fr);gap:3px;margin-top:14px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--line)}
.heat i.on{background:var(--green)} .heat i.na{opacity:.3}
.daysel{display:flex;gap:6px;flex-wrap:wrap}
.daysel button{padding:7px 11px;border-radius:11px;border:1.5px solid var(--line);font-size:13px;font-weight:700;background:var(--glass2)}
.daysel button.on{background:var(--grad);border-color:transparent;color:#fff}

/* takvim */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.calhead h2{margin:0 auto 0 0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal .dn{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding:4px 0;letter-spacing:.06em}
.cell{min-height:108px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-b);border-radius:15px;padding:7px;cursor:pointer;
  display:flex;flex-direction:column;gap:3px;overflow:hidden;text-align:left;transition:all .2s}
.cell:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.cell.out{opacity:.38}
.cell.picked{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cell .d{font-size:13px;font-weight:700;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.cell.today .d{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(108,76,255,.4)}
.cchip{font-size:11px;padding:3px 7px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.cchip.done{text-decoration:line-through;opacity:.55}
.cchip.p1{background:var(--red-soft);color:var(--red)}
.more{font-size:11px;color:var(--muted);padding-left:4px;font-weight:600}
.dots{display:none;gap:3px;flex-wrap:wrap;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dots i.p1{background:var(--red)} .dots i.done{background:var(--faint)}

/* filtreler & formlar */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 6px;align-items:center}
.seg{display:inline-flex;background:var(--glass2);border:1px solid var(--line);border-radius:13px;padding:3px}
.seg button{padding:7px 13px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);transition:all .2s}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(108,76,255,.3)}
.inp,.sel{width:100%;padding:11px 13px;border-radius:13px;border:1.5px solid var(--line);background:var(--glass2);outline:0;font-size:15px;transition:all .2s}
.inp:focus,.sel:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.sel.auto,.inp.auto{width:auto}
select.sel option{background:var(--bg);color:var(--text)}
textarea.inp{resize:vertical;min-height:72px}
label.f{display:block;font-size:11px;font-weight:800;color:var(--muted);margin:16px 0 7px;text-transform:uppercase;letter-spacing:.07em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

/* istatistik */
.kpi{position:relative;overflow:hidden;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--glass-b);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.kpi:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:var(--grad);opacity:.14;right:-24px;top:-24px}
.kpi b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi span{font-size:13px;color:var(--muted);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar i{width:100%;max-width:30px;background:var(--grad);border-radius:8px 8px 4px 4px;min-height:3px;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom}
.bar i.zero{background:var(--line)}
@keyframes grow{from{transform:scaleY(0)}}
.bar small{font-size:10px;color:var(--muted);font-weight:600}
.bar em{font-style:normal;font-size:11px;font-weight:800;color:var(--text)}
.hbar{display:grid;grid-template-columns:120px 1fr 36px;gap:10px;align-items:center;margin:9px 0;font-size:14px;font-weight:600}
.hbar .tr{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:6px;animation:growx .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
@keyframes growx{from{transform:scaleX(0)}}

/* odak */
.ft{text-align:center}
.ft .tm{font-size:52px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:6px 0 10px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ft .ph{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.1em}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,10,50,.35);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);background-image:linear-gradient(160deg,var(--accent-soft),transparent 40%);border:1px solid var(--glass-b);border-radius:26px;width:min(600px,100%);max-height:92vh;overflow:auto;padding:24px;
  box-shadow:0 30px 80px rgba(20,10,60,.35);animation:rise .3s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(24px) scale(.98);opacity:0}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet-h h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.title-inp{width:100%;border:0;outline:0;background:none;font-size:21px;font-weight:700;padding:10px 0;border-bottom:2px solid var(--line);transition:border-color .2s}
.title-inp:focus{border-image:var(--grad) 1}

.prio button.on.p2{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}

.mchk{width:20px;height:20px;border-radius:7px;border:2px solid var(--faint);display:grid;place-items:center;flex-shrink:0;color:#fff;transition:all .2s}
.mchk.on{background:linear-gradient(135deg,#10b981,#34d399);border-color:transparent}
.mchk svg{width:11px;height:11px}
.foot{display:flex;gap:8px;margin-top:24px;align-items:center}
.foot .sp{flex:1}
.aibox{margin-top:12px;border:1.5px solid var(--accent-soft);border-radius:16px;padding:14px;background:linear-gradient(135deg,rgba(66,133,244,.07),rgba(217,101,112,.07));animation:up .35s both}
.aistep{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:14px;font-weight:500}
.aistep span{flex:1}
.aistep small{color:var(--muted);white-space:nowrap}

/* ayarlar */
.set h3{margin-bottom:6px}
.set p.d{margin:0 0 12px;font-size:13px;color:var(--muted);line-height:1.55}
.steps{margin:6px 0 14px;padding-left:20px;font-size:13px;color:var(--muted);line-height:1.75}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--glass2)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status.ok i{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)} .status.ok{color:var(--green);background:var(--green-soft)}
.tagedit{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tagedit span{display:inline-flex;gap:6px;align-items:center;padding:5px 7px 5px 11px;border-radius:20px;font-size:13px;font-weight:700}
.tagedit span button{opacity:.6;font-size:15px;line-height:1}
.switch{position:relative;width:46px;height:26px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:var(--line);border-radius:20px;transition:.25s;cursor:pointer}
.switch i:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.switch input:checked+i{background:var(--grad)}
.switch input:checked+i:before{transform:translateX(20px)}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
code{background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:6px;font-size:12px}

/* bildirim */

<script>
(function(){
const store={};
window.PropertiesService={getScriptProperties:()=>({getProperty:k=>k in store?store[k]:null,setProperty:(k,v)=>{store[k]=String(v)},deleteProperty:k=>{delete store[k]}})};
function parts(d){const f=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});const o={};f.formatToParts(d).forEach(p=>o[p.type]=p.value);if(o.hour==='24')o.hour='00';return o;}
window.Utilities={getUuid:()=>(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+String(Math.random()).slice(2)+'abcdef0123456789abcd'),formatDate:(d,tz,f)=>{const p=parts(d);
 return f.replace("'T'",'§').replace('yyyy',p.year).replace('MM',p.month).replace('dd',p.day).replace('HH',p.hour).replace('mm',p.minute).replace('ss',p.second).replace(/^H$/,String(+p.hour)).replace(/^m$/,String(+p.minute)).replace('§','T');}};
class Range{constructor(sh,r,c,nr,nc){Object.assign(this,{sh,r,c,nr,nc})}
 getValues(){const out=[];for(let i=0;i<this.nr;i++){const row=[];for(let j=0;j<this.nc;j++){const v=(this.sh.data[this.r-1+i]||[])[this.c-1+j];row.push(v===undefined?'':v)}out.push(row)}return out}
 setValues(v){v.forEach((row,i)=>{const R=this.sh.data[this.r-1+i]=this.sh.data[this.r-1+i]||[];row.forEach((x,j)=>R[this.c-1+j]=x)});return this}
 setNumberFormat(){return this} setFontWeight(){return this} setBackground(){return this}}
class Sheet{constructor(n){this.name=n;this.data=[]} getRange(r,c,nr,nc){return new Range(this,r,c,nr||1,nc||1)} getLastRow(){return this.data.length} getMaxRows(){return 1000} setFrozenRows(){} deleteRow(r){this.data.splice(r-1,1)}}
const ss={sheets:[new Sheet('Sheet1')],getSheetByName(n){return this.sheets.find(s=>s.name===n)||null},insertSheet(n){const s=new Sheet(n);this.sheets.push(s);return s},getSheets(){return this.sheets},deleteSheet(s){this.sheets=this.sheets.filter(x=>x!==s)},getUrl:()=>'',getId:()=>'demo'};
window.SpreadsheetApp={create:()=>ss,openById:()=>ss};
window.LockService={getScriptLock:()=>({waitLock(){},releaseLock(){}})};
const cache={};window.CacheService={getScriptCache:()=>({get:k=>cache[k]||null,put:(k,v)=>{cache[k]=v}})};
window.ScriptApp={getService:()=>({getUrl:()=>''}),getProjectTriggers:()=>[],newTrigger:()=>({timeBased:()=>({everyMinutes:()=>({create(){}})})})};
window.Logger={log(){}};
window.ContentService={createTextOutput:s=>({setMimeType(){return s}}),MimeType:{JSON:1}};
window.HtmlService={createHtmlOutput:s=>s};
function addD(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
window.UrlFetchApp={fetch:(url,opt)=>{
  let body='{}';
  if(url.includes('telegram')){let result=true;if(url.endsWith('getUpdates'))result=[{update_id:1,message:{chat:{id:1,first_name:'Demo'},text:'/start'}}];if(url.endsWith('getWebhookInfo'))result={url:'x',pending_update_count:0};body=JSON.stringify({ok:true,result});}
  else if(url.includes('generativelanguage')){

    if(p.generationConfig.responseMimeType){
      const m=prompt.match(/Görev: (.*)/);const title=(m?m[1]:'Görev').slice(0,60);
      t=JSON.stringify({steps:[{title:'Kapsamı ve gereksinimleri netleştir',date:addD(0),minutes:30},{title:'Kaynakları ve örnekleri topla',date:addD(1),minutes:60},{title:'İlk taslağı hazırla',date:addD(2),minutes:120},{title:'Eksikleri tamamla ve gözden geçir',date:addD(3),minutes:60},{title:'Son kontrol ve teslim',date:addD(4),minutes:30}],tip:'“'+title+'” için her gün küçük bir adım at; en zor kısmı sabah enerjin yüksekken yap.'});
    } else if(/haftalık değerlendirme/i.test(prompt)){
      t='Bu hafta tempon gayet iyiydi; özellikle okul görevlerinde istikrarlısın, tebrikler! 👏\n\nGözlem: Görevlerin hafta sonuna yığılıyor ve fatura gibi küçük işler gecikmeye düşüyor.\n\nGelecek hafta için:\n• Vize sınavına 3 gün kala her gün 45 dk tekrar bloğu ayır.\n• Küçük ödemeleri pazartesi sabahı tek seferde hallet.\n• Su alışkanlığın çok iyi gidiyor, koşuyu da sabaha alarak seriyi büyüt.';
    } else {
      t='Günaydın Ahmet! Bugün odak noktan ödev teslimi.\n\n• 09:00–09:15 Gecikmiş elektrik faturasını hemen öde, aklında yer kaplamasın.\n• 09:30–12:00 Veri Yapıları ödevinin kalan iki adımını bitir (en kritik iş).\n• 13:30–14:30 CV’ni staj başvurusu için güncelle.\n• 18:30 Spor salonu — bu saati koru.\n• Akşam: ödevi son kez kontrol edip teslim et.\n\nKüçük adımlarla büyük işler biter, bugün senin günün! 💪';
    }

(function(){
/*******************************************************************
 *  PLANNER — Google Apps Script sunucu kodu
 *  - Veriler: Google Sheets ("Planner Veritabanı")
 *  - Arayüz: Index.html (PC + telefon)
 *  - Bildirim: Telegram botu (sabah özeti, akşam özeti, haftalık
 *    değerlendirme, saatli görev hatırlatmaları)
 *  - Yapay zekâ: Gemini API (günlük plan, alt adımlara bölme,
 *    haftalık değerlendirme)
 *
 *  İLK KURULUM: Üstteki menüden "kurulum" fonksiyonunu seçip Çalıştır.
 *******************************************************************/

const TZ = 'Europe/Istanbul';
const TASK_COLS = ['id', 'title', 'notes', 'date', 'time', 'priority', 'category', 'done', 'doneAt',
  'createdAt', 'repeat', 'remindDays', 'subtasks', 'lastReminder'];
const HABIT_COLS = ['id', 'name', 'emoji', 'days', 'log', 'createdAt'];
const DEFAULT_SETTINGS = {
  name: '',
  morningHour: 8,      // -1 = kapalı
  eveningHour: -1,     // -1 = kapalı
  weeklyDay: 0,        // 0 = Pazar
  weeklyHour: 20,      // -1 = kapalı
  remindMin: 30,       // saatli görevden kaç dk önce (0 = kapalı)
  categories: ['Okul', 'İş', 'Kişisel', 'Sağlık', 'Alışveriş'],
  aiInBrief: true,
  webAppUrl: '',
  siteUrl: ''       // GitHub Pages kabuk sitesi (simgeli telefon uygulaması)
};
const AY = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
const GUN = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
const REPEATS = ['', 'daily', 'weekdays', 'weekly', 'monthly'];

/* =================================================================
 *  KURULUM
 * ================================================================= */

/** Editörden bir kez çalıştır: veritabanını, anahtarları ve zamanlayıcıyı kurar. */
function kurulum() {
  const p = props_();
  if (!p.getProperty('ACCESS_KEY')) p.setProperty('ACCESS_KEY', randomKey_(16));
  if (!p.getProperty('TG_SECRET')) p.setProperty('TG_SECRET', randomKey_(32));
  const ss = db_();
  tetikleyiciKur_();
  Logger.log('✅ Kurulum tamamlandı.');
  Logger.log('📄 Veritabanı (Google Sheets): ' + ss.getUrl());
  Logger.log('🔑 Erişim anahtarın: ' + p.getProperty('ACCESS_KEY'));
  Logger.log('➡️ Şimdi: Dağıt > Yeni dağıtım > Web uygulaması (Yürüten: Ben, Erişim: Herkes).');
  Logger.log('➡️ Sonra web uygulaması adresinin sonuna  ?k=' + p.getProperty('ACCESS_KEY') + '  ekleyip aç.');
}

/** Erişim anahtarını unutursan bunu çalıştır. */
function anahtariGoster() {
  Logger.log('🔑 Erişim anahtarın: ' + getProp_('ACCESS_KEY'));
  try { Logger.log('🔗 ' + ScriptApp.getService().getUrl() + '?k=' + getProp_('ACCESS_KEY')); } catch (e) { }
}

/** Anahtarın başkasına geçtiğini düşünüyorsan yenile (eski link çalışmaz olur). */
function anahtariYenile() {
  props_().setProperty('ACCESS_KEY', randomKey_(16));
  anahtariGoster();
}

function tetikleyiciKur_() {
  ScriptApp.getProjectTriggers().forEach(function (t) {
    if (t.getHandlerFunction() === 'zamanlayici') ScriptApp.deleteTrigger(t);
  });
  ScriptApp.newTrigger('zamanlayici').timeBased().everyMinutes(15).create();
}

/* =================================================================
 *  WEB UYGULAMASI
 * ================================================================= */

function doGet(e) {
  // Kabuk sitenin anahtar kontrolü:  ...exec?ping=ANAHTAR  ->  {"ok":true|false}
  if (e && e.parameter && e.parameter.ping !== undefined) {
    return ContentService.createTextOutput(JSON.stringify({ ok: e.parameter.ping === getProp_('ACCESS_KEY') }))
      .setMimeType(ContentService.MimeType.JSON);
  }
  const key = e && e.parameter && e.parameter.k;
  const ok = !!key && key === getProp_('ACCESS_KEY');
  let url = '';
  try { url = ScriptApp.getService().getUrl(); } catch (err) { }
  if (!ok) {
    return withIcon_(HtmlService.createHtmlOutput(lockPage_(url))
      .setTitle('Planner')
      .addMetaTag('viewport', 'width=device-width, initial-scale=1')
      .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL));
  }
  const t = HtmlService.createTemplateFromFile('Index');
  t.key = key;
  t.url = settings_().webAppUrl || url;
  return withIcon_(t.evaluate()
    .setTitle('Planner')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL));   // kabuk sitenin içinde açılabilsin
}

function withIcon_(out) {
  const site = settings_().siteUrl;
  if (site) { try { out.setFaviconUrl(site + 'icons/icon-192.png'); } catch (e) { } }
  return out;
}

function lockPage_(url) {
  return '<!doctype html><html><head><meta charset="utf-8"><style>' +
    'body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f3fb;display:grid;place-items:center;min-height:100vh;margin:0;color:#1d1b2e}' +
    '.c{background:#fff;padding:32px 28px;border-radius:20px;box-shadow:0 10px 40px rgba(60,40,140,.12);width:min(340px,88vw);text-align:center}' +
    'h1{font-size:22px;margin:8px 0 4px}p{color:#6b6880;font-size:14px;margin:0 0 18px}' +
    'input{width:100%;box-sizing:border-box;padding:12px 14px;border:1.5px solid #ddd9f0;border-radius:12px;font-size:16px;margin-bottom:12px}' +
    'button{width:100%;padding:12px;border:0;border-radius:12px;background:#5b4bdb;color:#fff;font-size:16px;font-weight:600;cursor:pointer}' +
    '</style></head><body><form class="c" method="get" action="' + url + '" target="_top">' +
    '<div style="font-size:40px">🔒</div><h1>Planner</h1><p>Erişim anahtarını gir</p>' +
    '<input name="k" type="password" autocomplete="current-password" placeholder="Erişim anahtarı" required>' +
    '<button type="submit">Aç</button></form></body></html>';
}

/** Arayüzün çağırdığı tek giriş noktası. */
function api(key, action, data) {
  if (!key || key !== getProp_('ACCESS_KEY')) throw new Error('Yetkisiz erişim. Linki ?k=anahtar ile aç.');
  data = data || {};
  const mutate = function (fn) {
    const lock = LockService.getScriptLock();
    lock.waitLock(20000);
    try { return fn(); } finally { lock.releaseLock(); }
  };
  let extra = {};
  switch (action) {
    case 'load': return { state: state_() };

    case 'saveTask': extra.id = mutate(function () { return saveTask_(data); }); break;
    case 'quickAdd': extra.task = mutate(function () { return quickAdd_(data.text); }); break;
    case 'addMany': mutate(function () { (data.tasks || []).slice(0, 20).forEach(function (t) { saveTask_(t); }); }); break;
    case 'toggleTask': mutate(function () { toggleTask_(data.id, data.done); }); break;
    case 'toggleSub': mutate(function () { toggleSub_(data.id, data.index); }); break;
    case 'deleteTask': mutate(function () { deleteTask_(data.id); }); break;
    case 'moveUndone': extra.count = mutate(function () { return moveUndoneToTomorrow_(); }); break;

    case 'saveHabit': mutate(function () { saveHabit_(data); }); break;
    case 'toggleHabit': mutate(function () { toggleHabit_(data.id, data.date); }); break;
    case 'deleteHabit': mutate(function () { deleteHabit_(data.id); }); break;

    case 'saveSettings': saveSettings_(data); break;

    case 'tgConnect': extra.result = tgConnect_(); break;
    case 'tgTest': tgSend_('🔔 Test mesajı — Planner çalışıyor! ✨'); break;
    case 'tgBrief': sendMorning_(); break;
    case 'tgWeekly': sendWeekly_(); break;
    case 'tgStatus': extra.result = tgStatus_(); break;
    case 'tgWebhook': setWebhook_(); extra.result = tgStatus_(); break;

    case 'aiPlan': return { text: aiDayPlan_() };
    case 'aiBreakdown': return { result: aiBreakdown_(data) };
    case 'aiWeekly': return { text: aiWeekly_() };
    case 'aiTest': return { text: gemini_('Sadece "Merhaba, hazırım!" yaz.'), model: getProp_('GEMINI_MODEL') || 'gemini-flash-latest' };

    default: throw new Error('Bilinmeyen işlem: ' + action);
  }
  extra.state = state_();
  return extra;
}

function state_() {
  const today = todayStr_();
  const cutoff = addDays_(today, -120);
  const tasks = getTasks_()
    .filter(function (t) { return !t.done || !t.doneAt || t.doneAt.slice(0, 10) >= cutoff; })
    .map(stripRow_);
  return { tasks: tasks, habits: getHabits_().map(stripRow_), settings: publicSettings_(), today: today };
}

function stripRow_(o) { const c = Object.assign({}, o); delete c._row; return c; }

/* =================================================================
 *  VERİTABANI (Google Sheets)
 * ================================================================= */

let _ss = null;
function db_() {
  if (_ss) return _ss;
  const p = props_();
  const id = p.getProperty('SHEET_ID');
  let ss = null;
  if (id) { try { ss = SpreadsheetApp.openById(id); } catch (e) { ss = null; } }
  if (!ss) { ss = SpreadsheetApp.create('Planner Veritabanı'); p.setProperty('SHEET_ID', ss.getId()); }
  ensureSheet_(ss, 'Gorevler', TASK_COLS);
  ensureSheet_(ss, 'Aliskanliklar', HABIT_COLS);
  ['Sheet1', 'Sayfa1'].forEach(function (n) {
    const s = ss.getSheetByName(n);
    if (s && ss.getSheets().length > 2) ss.deleteSheet(s);
  });
  _ss = ss;
  return ss;
}

function ensureSheet_(ss, name, cols) {
  let sh = ss.getSheetByName(name);
  if (!sh) {
    sh = ss.insertSheet(name);
    sh.getRange(1, 1, sh.getMaxRows(), cols.length).setNumberFormat('@');
    sh.getRange(1, 1, 1, cols.length).setValues([cols]).setFontWeight('bold').setBackground('#ece9fb');
    sh.setFrozenRows(1);
  }
  return sh;
}

function readTable_(name, cols) {
  const sh = db_().getSheetByName(name);
  const last = sh.getLastRow();
  if (last < 2) return [];
  const vals = sh.getRange(2, 1, last - 1, cols.length).getValues();
  const out = [];
  vals.forEach(function (r, i) {
    if (r[0] === '' || r[0] === null) return;
    const o = { _row: i + 2 };
    cols.forEach(function (c, j) { o[c] = norm_(r[j]); });
    out.push(o);
  });
  return out;
}

function norm_(v) {
  if (v instanceof Date) {
    return v.getFullYear() < 1901 ? Utilities.formatDate(v, TZ, 'HH:mm') : Utilities.formatDate(v, TZ, 'yyyy-MM-dd');
  }
  return v === null || v === undefined ? '' : String(v);
}

function writeRow_(name, row, values) {
  const rg = db_().getSheetByName(name).getRange(row, 1, 1, values.length);
  rg.setNumberFormat('@');
  rg.setValues([values]);
}

function appendRow_(name, values) {
  const sh = db_().getSheetByName(name);
  writeRow_(name, sh.getLastRow() + 1, values);
}

/* ---------- Görevler ---------- */

function getTasks_() {
  return readTable_('Gorevler', TASK_COLS).map(function (r) {
    return {
      _row: r._row, id: r.id, title: r.title, notes: r.notes, date: r.date, time: r.time,
      priority: Number(r.priority) || 2, category: r.category,
      done: r.done === '1' || r.done === 'TRUE' || r.done === 'true',
      doneAt: r.doneAt, createdAt: r.createdAt, repeat: r.repeat,
      remindDays: r.remindDays === '' ? 2 : Number(r.remindDays) || 0,
      subtasks: safeJson_(r.subtasks, []), lastReminder: r.lastReminder
    };
  });
}

function taskToRow_(t) {
  return TASK_COLS.map(function (c) {
    let v = t[c];
    if (c === 'done') v = t.done ? '1' : '';
    else if (c === 'subtasks') v = JSON.stringify(t.subtasks || []);
    return v === undefined || v === null ? '' : String(v);
  });
}

function cleanTask_(d) {
  return {
    title: String(d.title || '').replace(/\s+/g, ' ').trim().slice(0, 300),
    notes: String(d.notes || '').slice(0, 5000),
    date: validDate_(d.date),
    time: validTime_(d.time),
    priority: [1, 2, 3].indexOf(Number(d.priority)) >= 0 ? Number(d.priority) : 2,
    category: String(d.category || '').trim().slice(0, 40),
    repeat: REPEATS.indexOf(d.repeat || '') >= 0 ? (d.repeat || '') : '',
    remindDays: clampInt_(d.remindDays, 0, 60, 2),
    subtasks: Array.isArray(d.subtasks) ? d.subtasks.slice(0, 60).map(function (s) {
      return { t: String(s.t || '').trim().slice(0, 200), d: !!s.d, date: validDate_(s.date) };
    }).filter(function (s) { return s.t; }) : []
  };
}

function saveTask_(d) {
  const c = cleanTask_(d);
  if (!c.title) throw new Error('Görev başlığı boş olamaz.');
  const tasks = getTasks_();
  let t = d.id ? tasks.filter(function (x) { return x.id === d.id; })[0] : null;
  if (t) {
    if (t.date !== c.date || t.time !== c.time) t.lastReminder = '';
    Object.assign(t, c);
    writeRow_('Gorevler', t._row, taskToRow_(t));
  } else {
    t = Object.assign({ id: randomKey_(10), done: false, doneAt: '', createdAt: nowIso_(), lastReminder: '' }, c);
    appendRow_('Gorevler', taskToRow_(t));
  }
  return t.id;
}

function quickAdd_(text) {
  const p = parseQuick_(text, todayStr_());
  if (!p.title) throw new Error('Görev metni boş.');
  const id = saveTask_(p);
  p.id = id;
  return p;
}

function findTask_(id) {
  const t = getTasks_().filter(function (x) { return x.id === id; })[0];
  if (!t) throw new Error('Görev bulunamadı.');
  return t;
}

function toggleTask_(id, done) {
  const tasks = getTasks_();
  const t = tasks.filter(function (x) { return x.id === id; })[0];
  if (!t) throw new Error('Görev bulunamadı.');
  const nd = (done === undefined || done === null) ? !t.done : !!done;
  if (nd === t.done) return t;
  t.done = nd;
  t.doneAt = nd ? nowIso_() : '';
  writeRow_('Gorevler', t._row, taskToRow_(t));
  if (nd && t.repeat) {
    const today = todayStr_();
    let next = nextDate_(t.date || today, t.repeat);
    let guard = 0;
    while (next < today && guard++ < 400) next = nextDate_(next, t.repeat);
    const exists = tasks.some(function (x) { return !x.done && x.id !== t.id && x.title === t.title && x.date === next; });
    if (!exists) {
      const copy = Object.assign({}, t, {
        id: randomKey_(10), date: next, done: false, doneAt: '', createdAt: nowIso_(), lastReminder: '',
        subtasks: (t.subtasks || []).map(function (s) { return { t: s.t, d: false, date: '' }; })
      });
      appendRow_('Gorevler', taskToRow_(copy));
    }
  }
  return t;
}

function toggleSub_(id, index) {
  const t = findTask_(id);
  const s = t.subtasks[Number(index)];
  if (!s) return;
  s.d = !s.d;
  writeRow_('Gorevler', t._row, taskToRow_(t));
}

function deleteTask_(id) {
  const t = findTask_(id);
  db_().getSheetByName('Gorevler').deleteRow(t._row);
}

function moveUndoneToTomorrow_() {
  const today = todayStr_();
  const tomorrow = addDays_(today, 1);
  let n = 0;
  getTasks_().forEach(function (t) {
    if (!t.done && t.date && t.date <= today) {
      t.date = tomorrow; t.lastReminder = '';
      writeRow_('Gorevler', t._row, taskToRow_(t));
      n++;
    }
  });
  return n;
}

/* ---------- Alışkanlıklar ---------- */

function getHabits_() {
  return readTable_('Aliskanliklar', HABIT_COLS).map(function (r) {
    return { _row: r._row, id: r.id, name: r.name, emoji: r.emoji || '✅', days: r.days || '0123456', log: safeJson_(r.log, []), createdAt: r.createdAt };
  });
}

function habitToRow_(h) {
  return HABIT_COLS.map(function (c) {
    const v = c === 'log' ? JSON.stringify(h.log || []) : h[c];
    return v === undefined || v === null ? '' : String(v);
  });
}

function saveHabit_(d) {
  const name = String(d.name || '').trim().slice(0, 60);
  if (!name) throw new Error('Alışkanlık adı boş olamaz.');
  const days = String(d.days || '0123456').replace(/[^0-6]/g, '') || '0123456';
  const emoji = String(d.emoji || '✅').slice(0, 8);
  const habits = getHabits_();
  let h = d.id ? habits.filter(function (x) { return x.id === d.id; })[0] : null;
  if (h) {
    h.name = name; h.days = days; h.emoji = emoji;
    writeRow_('Aliskanliklar', h._row, habitToRow_(h));
  } else {
    h = { id: randomKey_(10), name: name, emoji: emoji, days: days, log: [], createdAt: nowIso_() };
    appendRow_('Aliskanliklar', habitToRow_(h));
  }
}

function toggleHabit_(id, date) {
  const h = getHabits_().filter(function (x) { return x.id === id; })[0];
  if (!h) throw new Error('Alışkanlık bulunamadı.');
  date = validDate_(date) || todayStr_();
  const i = h.log.indexOf(date);
  if (i >= 0) h.log.splice(i, 1); else h.log.push(date);
  h.log.sort();
  if (h.log.length > 500) h.log = h.log.slice(-500);
  writeRow_('Aliskanliklar', h._row, habitToRow_(h));
}

function deleteHabit_(id) {
  const h = getHabits_().filter(function (x) { return x.id === id; })[0];
  if (h) db_().getSheetByName('Aliskanliklar').deleteRow(h._row);
}

/* =================================================================
 *  AYARLAR
 * ================================================================= */

function settings_() {
  return Object.assign({}, DEFAULT_SETTINGS, safeJson_(getProp_('SETTINGS'), {}));
}

function publicSettings_() {
  const s = settings_();
  let auto = '';
  try { auto = ScriptApp.getService().getUrl(); } catch (e) { }
  let sheetUrl = '';
  try { sheetUrl = db_().getUrl(); } catch (e) { }
  return Object.assign(s, {
    tgTokenSet: !!getProp_('TG_TOKEN'),
    tgConnected: !!getProp_('TG_CHAT_ID'),
    geminiSet: !!getProp_('GEMINI_KEY'),
    geminiModel: getProp_('GEMINI_MODEL') || '',
    webAppUrlAuto: auto,
    sheetUrl: sheetUrl
  });
}

function saveSettings_(d) {
  const s = settings_();
  if ('name' in d) s.name = String(d.name || '').trim().slice(0, 40);
  if ('morningHour' in d) s.morningHour = clampInt_(d.morningHour, -1, 23, 8);
  if ('eveningHour' in d) s.eveningHour = clampInt_(d.eveningHour, -1, 23, -1);
  if ('weeklyDay' in d) s.weeklyDay = clampInt_(d.weeklyDay, 0, 6, 0);
  if ('weeklyHour' in d) s.weeklyHour = clampInt_(d.weeklyHour, -1, 23, 20);
  if ('remindMin' in d) s.remindMin = clampInt_(d.remindMin, 0, 240, 30);
  if ('aiInBrief' in d) s.aiInBrief = !!d.aiInBrief;
  if ('categories' in d && Array.isArray(d.categories)) {
    const seen = {};
    s.categories = d.categories.map(function (c) { return String(c).trim().slice(0, 40); })
      .filter(function (c) { if (!c || seen[c]) return false; seen[c] = 1; return true; }).slice(0, 30);
  }
  if ('siteUrl' in d) {
    let u = String(d.siteUrl || '').trim().replace(/[?#].*$/, '');
    if (u && !/\/$/.test(u)) u += '/';
    s.siteUrl = /^https:\/\/[^\s<>"']+$/.test(u) ? u : '';
  }
  if ('webAppUrl' in d) {
    const u = String(d.webAppUrl || '').trim().replace(/\?.*$/, '');
    s.webAppUrl = /^https:\/\/script\.google\.com\/.+\/exec$/.test(u) ? u : '';
  }
  const p = props_();
  p.setProperty('SETTINGS', JSON.stringify(s));
  if (d.tgToken) {
    const tok = String(d.tgToken).trim();
    if (tok !== getProp_('TG_TOKEN')) { p.setProperty('TG_TOKEN', tok); p.deleteProperty('TG_CHAT_ID'); }
  }
  if (d.geminiKey) p.setProperty('GEMINI_KEY', String(d.geminiKey).trim());
  if ('geminiModel' in d) {
    const m = String(d.geminiModel || '').trim().replace(/^models\//, '');
    if (m) p.setProperty('GEMINI_MODEL', m); else p.deleteProperty('GEMINI_MODEL');
  }
  if (d.clearGemini) p.deleteProperty('GEMINI_KEY');
  if (d.clearTelegram) {
    try { tg_('deleteWebhook', {}); } catch (e) { }
    p.deleteProperty('TG_TOKEN'); p.deleteProperty('TG_CHAT_ID');
  }
}

/* =================================================================
 *  ZAMANLAYICI (15 dakikada bir çalışır)
 * ================================================================= */

function zamanlayici() {
  if (!getProp_('TG_TOKEN') || !getProp_('TG_CHAT_ID')) return;
  const s = settings_();
  const p = props_();
  const today = todayStr_();
  const hour = Number(Utilities.formatDate(new Date(), TZ, 'H'));
  const inWindow = function (h) { return h >= 0 && hour >= h && hour < h + 3; };

  try {
    if (inWindow(s.morningHour) && p.getProperty('LAST_MORNING') !== today) {
      sendMorning_();
      p.setProperty('LAST_MORNING', today);
    }
  } catch (e) { console.error('Sabah özeti: ' + e); }

  try {
    if (inWindow(s.eveningHour) && p.getProperty('LAST_EVENING') !== today) {
      sendEvening_();
      p.setProperty('LAST_EVENING', today);
    }
  } catch (e) { console.error('Akşam özeti: ' + e); }

  try {
    if (dow_(today) === Number(s.weeklyDay) && inWindow(s.weeklyHour) && p.getProperty('LAST_WEEKLY') !== today) {
      sendWeekly_();
      p.setProperty('LAST_WEEKLY', today);
    }
  } catch (e) { console.error('Haftalık: ' + e); }

  try { sendReminders_(s); } catch (e) { console.error('Hatırlatma: ' + e); }
}

function sendReminders_(s) {
  const win = Number(s.remindMin) || 0;
  if (win <= 0) return;
  const today = todayStr_();
  const now = nowMin_();
  getTasks_().forEach(function (t) {
    if (t.done || t.date !== today || !t.time) return;
    const mins = toMin_(t.time) - now;
    const stamp = t.date + ' ' + t.time;
    if (mins >= -5 && mins <= win && t.lastReminder !== stamp) {
      const when = mins <= 1 ? 'şimdi' : mins + ' dk sonra';
      tgSend_('⏰ <b>' + when + '</b> (' + t.time + ')\n' + esc_(t.title) +
        (t.notes ? '\n<i>' + esc_(t.notes.slice(0, 200)) + '</i>' : ''),
        { reply_markup: { inline_keyboard: [[{ text: '✅ Tamamlandı', callback_data: 'd:' + t.id }]] } });
      t.lastReminder = stamp;
      writeRow_('Gorevler', t._row, taskToRow_(t));
    }
  });
}

/* =================================================================
 *  MESAJ İÇERİKLERİ
 * ================================================================= */

function prioIcon_(p) { return p === 1 ? '🔴' : p === 3 ? '⚪' : '🟡'; }

function taskLine_(t, num, showDate) {
  let s = (num ? num + '. ' : '• ') + prioIcon_(t.priority) + ' ';
  if (t.time) s += '<b>' + t.time + '</b> ';
  s += esc_(t.title);
  if (t.subtasks && t.subtasks.length) {
    const d = t.subtasks.filter(function (x) { return x.d; }).length;
    s += ' (' + d + '/' + t.subtasks.length + ')';
  }
  if (t.category) s += ' <i>#' + esc_(t.category) + '</i>';
  if (showDate) s += ' — ' + showDate;
  return s;
}

function sortTasks_(a, b) {
  if ((a.date || '9') !== (b.date || '9')) return (a.date || '9') < (b.date || '9') ? -1 : 1;
  if ((a.time || '99') !== (b.time || '99')) return (a.time || '99') < (b.time || '99') ? -1 : 1;
  return a.priority - b.priority;
}

function dayContext_() {
  const today = todayStr_();
  const open = getTasks_().filter(function (t) { return !t.done; });
  const todays = open.filter(function (t) { return t.date === today; }).sort(sortTasks_);
  const overdue = open.filter(function (t) { return t.date && t.date < today; }).sort(sortTasks_);
  const upcoming = open.filter(function (t) {
    if (!t.date || t.date <= today) return false;
    return diffDays_(today, t.date) <= Math.max(1, t.remindDays);
  }).sort(sortTasks_);
  const undatedImportant = open.filter(function (t) { return !t.date && t.priority === 1; }).slice(0, 5);
  const dw = String(dow_(today));
  const habits = getHabits_().filter(function (h) { return h.days.indexOf(dw) >= 0; });
  return { today: today, todays: todays, overdue: overdue, upcoming: upcoming, undatedImportant: undatedImportant, habits: habits };
}

function appLink_() {
  const s = settings_();
  if (s.siteUrl) return '\n\n🔗 <a href="' + s.siteUrl + '?app=1#k=' + getProp_('ACCESS_KEY') + '">Planner’ı aç</a>';
  let url = s.webAppUrl;
  if (!url) { try { url = ScriptApp.getService().getUrl(); } catch (e) { } }
  return url ? '\n\n🔗 <a href="' + url + '?k=' + getProp_('ACCESS_KEY') + '">Planner’ı aç</a>' : '';
}

function doneKeyboard_(tasks) {
  const rows = tasks.slice(0, 8).map(function (t) {
    return [{ text: '✅ ' + t.title.slice(0, 40), callback_data: 'd:' + t.id }];
  });
  return rows.length ? { inline_keyboard: rows } : null;
}

function buildMorning_() {
  const s = settings_();
  const c = dayContext_();
  const L = [];
  L.push('☀️ <b>Günaydın' + (s.name ? ' ' + esc_(s.name) : '') + '!</b>');
  L.push('📅 ' + fmtLong_(c.today));
  const numbered = [];
  let n = 0;

  if (c.todays.length) {
    L.push('\n📌 <b>Bugün yapılacaklar (' + c.todays.length + ')</b>');
    c.todays.forEach(function (t) { numbered.push(t.id); L.push(taskLine_(t, ++n)); });
  } else {
    L.push('\n📌 Bugün için planlanmış görev yok. 🌿');
  }
  if (c.overdue.length) {
    L.push('\n⚠️ <b>Gecikenler (' + c.overdue.length + ')</b>');
    c.overdue.slice(0, 10).forEach(function (t) {
      numbered.push(t.id);
      L.push(taskLine_(t, ++n, diffDays_(t.date, c.today) + ' gün gecikti'));
    });
  }
  if (c.upcoming.length) {
    L.push('\n⏳ <b>Yaklaşan tarihler</b>');
    c.upcoming.slice(0, 10).forEach(function (t) {
      const d = diffDays_(c.today, t.date);
      L.push(taskLine_(t, null, (d === 1 ? 'yarın' : d + ' gün kaldı') + ' (' + fmtShort_(t.date) + ')'));
    });
  }
  if (c.undatedImportant.length) {
    L.push('\n⭐ <b>Tarihsiz önemli işler</b>');
    c.undatedImportant.forEach(function (t) { L.push(taskLine_(t)); });
  }
  if (c.habits.length) {
    L.push('\n🔁 <b>Alışkanlıklar:</b> ' + c.habits.map(function (h) { return h.emoji + ' ' + esc_(h.name); }).join(', '));
  }
  if (s.aiInBrief && getProp_('GEMINI_KEY') && (c.todays.length || c.overdue.length || c.upcoming.length)) {
    try { L.push('\n🤖 <b>Gemini’nin önerisi</b>\n' + esc_(aiDayPlan_(c).slice(0, 1500))); }
    catch (e) { console.error('AI plan: ' + e); }
  }
  props_().setProperty('TG_LAST', JSON.stringify(numbered));
  let text = L.join('\n');
  if (numbered.length) text += '\n\n<i>Bitirdiğinde aşağıdaki butona bas ya da /bitti 1 yaz.</i>';
  text += appLink_();
  return { text: text, keyboard: doneKeyboard_(c.todays.concat(c.overdue)) };
}

function sendMorning_() {
  const m = buildMorning_();
  tgSend_(m.text, m.keyboard ? { reply_markup: m.keyboard } : null);
}

function sendEvening_() {
  const today = todayStr_();
  const tomorrow = addDays_(today, 1);
  const tasks = getTasks_();
  const doneToday = tasks.filter(function (t) { return t.done && (t.doneAt || '').slice(0, 10) === today; });
  const left = tasks.filter(function (t) { return !t.done && t.date && t.date <= today; }).sort(sortTasks_);
  const tmr = tasks.filter(function (t) { return !t.done && t.date === tomorrow; }).sort(sortTasks_);
  const L = ['🌙 <b>Gün sonu özeti</b>'];
  L.push('✅ Bugün ' + doneToday.length + ' görev tamamladın' + (doneToday.length >= 3 ? ' — harika! 🎉' : '.'));
  if (left.length) {
    L.push('\n⏸ <b>Kalanlar (' + left.length + ')</b>');
    left.slice(0, 10).forEach(function (t) { L.push(taskLine_(t)); });
  }
  if (tmr.length) {
    L.push('\n📅 <b>Yarın (' + fmtShort_(tomorrow) + ')</b>');
    tmr.forEach(function (t) { L.push(taskLine_(t)); });
  } else L.push('\n📅 Yarın için planlanmış görev yok.');
  const kb = left.length ? { inline_keyboard: [[{ text: '➡️ Kalanları yarına taşı', callback_data: 'mv' }]] } : null;
  tgSend_(L.join('\n') + appLink_(), kb ? { reply_markup: kb } : null);
}

function weekStats_() {
  const today = todayStr_();
  const start = addDays_(today, -6);
  const tasks = getTasks_();
  const done = tasks.filter(function (t) { return t.done && t.doneAt && t.doneAt.slice(0, 10) >= start; });
  const byCat = {};
  done.forEach(function (t) { const k = t.category || 'Diğer'; byCat[k] = (byCat[k] || 0) + 1; });
  const dueThisWeek = tasks.filter(function (t) { return t.date && t.date >= start && t.date <= today; });
  const dueDone = dueThisWeek.filter(function (t) { return t.done; }).length;
  const overdue = tasks.filter(function (t) { return !t.done && t.date && t.date < today; });
  const next = tasks.filter(function (t) { return !t.done && t.date && t.date > today && t.date <= addDays_(today, 7); }).sort(sortTasks_);
  const habits = getHabits_().map(function (h) {
    let planned = 0, hit = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDays_(start, i);
      if (h.days.indexOf(String(dow_(d))) >= 0) { planned++; if (h.log.indexOf(d) >= 0) hit++; }
    }
    return { name: h.name, emoji: h.emoji, planned: planned, hit: hit };
  });
  return { start: start, today: today, done: done, byCat: byCat, dueCount: dueThisWeek.length, dueDone: dueDone, overdue: overdue, next: next, habits: habits };
}

function sendWeekly_() {
  const w = weekStats_();
  const L = ['📊 <b>Haftalık değerlendirme</b>', fmtShort_(w.start) + ' – ' + fmtShort_(w.today)];
  L.push('\n✅ Tamamlanan görev: <b>' + w.done.length + '</b>');
  if (w.dueCount) L.push('🎯 Bu hafta tarihi olanlardan ' + w.dueDone + '/' + w.dueCount + ' bitti (%' + Math.round(100 * w.dueDone / w.dueCount) + ')');
  const cats = Object.keys(w.byCat).sort(function (a, b) { return w.byCat[b] - w.byCat[a]; });
  if (cats.length) L.push('🏷 ' + cats.map(function (k) { return esc_(k) + ': ' + w.byCat[k]; }).join(' · '));
  if (w.habits.length) {
    L.push('\n🔁 <b>Alışkanlıklar</b>');
    w.habits.forEach(function (h) { L.push(h.emoji + ' ' + esc_(h.name) + ': ' + h.hit + '/' + h.planned); });
  }
  if (w.overdue.length) L.push('\n⚠️ Geciken görev: ' + w.overdue.length);
  if (w.next.length) {
    L.push('\n📅 <b>Önümüzdeki 7 gün</b>');
    w.next.slice(0, 12).forEach(function (t) { L.push(taskLine_(t, null, fmtShort_(t.date))); });
  }
  if (getProp_('GEMINI_KEY')) {
    try { L.push('\n🤖 <b>Gemini’nin yorumu</b>\n' + esc_(aiWeekly_(w).slice(0, 1800))); }
    catch (e) { console.error('AI haftalık: ' + e); }
  }
  tgSend_(L.join('\n') + appLink_());
}

function tg_(method, payload) {
  const token = getProp_('TG_TOKEN');
  if (!token) throw new Error('Telegram bot token’ı girilmemiş (Ayarlar).');
  const res = UrlFetchApp.fetch('https://api.telegram.org/bot' + token + '/' + method, {
    method: 'post', contentType: 'application/json', payload: JSON.stringify(payload || {}), muteHttpExceptions: true
  });
  let j;
  try { j = JSON.parse(res.getContentText()); } catch (e) { throw new Error('Telegram yanıtı okunamadı (' + res.getResponseCode() + ')'); }
  if (!j.ok) throw new Error('Telegram: ' + (j.description || res.getResponseCode()));
  return j.result;
}

function tgSend_(text, extra) {
  const chat = getProp_('TG_CHAT_ID');
  if (!chat) throw new Error('Telegram bağlı değil. Ayarlar’dan “Bağla”ya bas.');
  if (text.length > 4000) text = text.slice(0, 3990) + '…';
  const payload = Object.assign({ chat_id: chat, text: text, parse_mode: 'HTML', disable_web_page_preview: true }, extra || {});
  try { return tg_('sendMessage', payload); }
  catch (e) {
    // HTML biçimi bozulursa düz metin olarak dene
    if (/parse|entities/i.test(String(e))) {
      payload.text = text.replace(/<[^>]+>/g, '');
      delete payload.parse_mode;
      return tg_('sendMessage', payload);
    }
    throw e;
  }
}

function webAppUrl_() {
  const s = settings_();
  if (s.webAppUrl) return s.webAppUrl;
  try { return ScriptApp.getService().getUrl(); } catch (e) { return ''; }
}

function setWebhook_() {
  const url = webAppUrl_();
  if (!url || !/\/exec$/.test(url)) throw new Error('Web uygulaması adresi bulunamadı. Ayarlar’a /exec ile biten adresi yapıştır.');
  tg_('setWebhook', { url: url + '?tg=' + getProp_('TG_SECRET'), drop_pending_updates: true, allowed_updates: ['message', 'callback_query'] });
}

function tgConnect_() {
  try { tg_('deleteWebhook', { drop_pending_updates: false }); } catch (e) { }
  const ups = tg_('getUpdates', { limit: 100, timeout: 0 }) || [];
  const msgs = ups.map(function (u) { return u.message || u.edited_message; }).filter(Boolean);
  if (!msgs.length) throw new Error('Bota henüz mesaj gelmemiş. Telegram’da botunu aç, /start yaz ve tekrar “Bağla”ya bas.');
  const m = msgs[msgs.length - 1];
  props_().setProperty('TG_CHAT_ID', String(m.chat.id));
  setWebhook_();
  tgSend_('✅ <b>Planner bağlandı!</b>\nArtık her sabah günün planını buraya göndereceğim.\n\n' + helpText_());
  return { chatId: String(m.chat.id), name: (m.chat.first_name || m.chat.title || '') };
}

/** Telegram webhook girişi */
function doPost(e) {
  try {
    if (!e || !e.parameter || e.parameter.tg !== getProp_('TG_SECRET')) return HtmlService.createHtmlOutput('no');
    const upd = JSON.parse(e.postData.contents);
    const cache = CacheService.getScriptCache();
    if (cache.get('u' + upd.update_id)) return HtmlService.createHtmlOutput('ok');
    cache.put('u' + upd.update_id, '1', 21600);
    const chat = getProp_('TG_CHAT_ID');

    if (upd.callback_query) {
      const q = upd.callback_query;
      if (!q.message || String(q.message.chat.id) !== chat) return HtmlService.createHtmlOutput('ok');
      handleCallback_(q);
    } else {
      const msg = upd.message || upd.edited_message;
      if (msg && String(msg.chat.id) === chat && !upd.edited_message) handleTg_(msg);
    }
  } catch (err) {
    console.error('doPost: ' + err + '\n' + (err.stack || ''));
  }
  return HtmlService.createHtmlOutput('ok');
}

function handleCallback_(q) {
  const data = q.data || '';
  let answer = '';
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    if (data.indexOf('d:') === 0) {
      const t = toggleTask_(data.slice(2), true);
      answer = '✅ Tamamlandı: ' + t.title.slice(0, 60);
      const kb = (q.message.reply_markup && q.message.reply_markup.inline_keyboard || [])
        .map(function (row) { return row.filter(function (b) { return b.callback_data !== data; }); })
        .filter(function (row) { return row.length; });
      try { tg_('editMessageReplyMarkup', { chat_id: q.message.chat.id, message_id: q.message.message_id, reply_markup: { inline_keyboard: kb } }); } catch (e) { }
    } else if (data === 'mv') {
      const n = moveUndoneToTomorrow_();
      answer = '➡️ ' + n + ' görev yarına taşındı';
      try { tg_('editMessageReplyMarkup', { chat_id: q.message.chat.id, message_id: q.message.message_id, reply_markup: { inline_keyboard: [] } }); } catch (e) { }
    }
  } catch (e) {
    answer = 'Hata: ' + e.message;
  } finally { lock.releaseLock(); }
  try { tg_('answerCallbackQuery', { callback_query_id: q.id, text: answer.slice(0, 190) }); } catch (e) { }
}

function handleTg_(msg) {
  const text = String(msg.text || '').trim();
  if (!text) return;
  const parts = text.split(/\s+/);
  const cmd = trLower_(parts[0]).replace(/@.*$/, '');
  const arg = parts.slice(1).join(' ');
  const today = todayStr_();
  const withLock = function (fn) {
    const lock = LockService.getScriptLock(); lock.waitLock(20000);
    try { return fn(); } finally { lock.releaseLock(); }
  };

  try {
    switch (cmd) {
      case '/start': case '/yardim': case '/yardım': case '/help':
        tgSend_(helpText_()); break;
      case '/bugun': case '/bugün':
        sendDayList_(today, 'Bugün'); break;
      case '/yarin': case '/yarın':
        sendDayList_(addDays_(today, 1), 'Yarın'); break;
      case '/hafta':
        sendWeekList_(); break;
      case '/ozet': case '/özet':
        sendMorning_(); break;
      case '/aksam': case '/akşam':
        sendEvening_(); break;
      case '/rapor':
        sendWeekly_(); break;
      case '/plan':
        tgSend_('🤖 <b>Günün planı</b>\n' + esc_(aiDayPlan_())); break;
      case '/bitti': {
        const ids = safeJson_(getProp_('TG_LAST'), []);
        const nums = arg.split(/[\s,]+/).map(Number).filter(function (x) { return x > 0; });
        if (!nums.length) { tgSend_('Kullanım: /bitti 2  (önce /bugun ile listeyi gör)'); break; }
        const doneTitles = withLock(function () {
          return nums.map(function (k) { const id = ids[k - 1]; return id ? toggleTask_(id, true).title : null; }).filter(Boolean);
        });
        tgSend_(doneTitles.length ? '🎉 Tamamlandı:\n' + doneTitles.map(function (t) { return '✅ ' + esc_(t); }).join('\n') : 'Bu numarada görev yok. /bugun ile listeyi yenile.');
        break;
      }
      case '/gemini': {
        try { tg_('deleteMessage', { chat_id: msg.chat.id, message_id: msg.message_id }); } catch (e) { }
        const k = arg.trim();
        if (!/^AIza[\w-]{20,}$/.test(k)) { tgSend_('Kullanım: /gemini AIza…  (anahtarı aistudio.google.com/apikey adresinden al)'); break; }
        props_().setProperty('GEMINI_KEY', k);
        try { gemini_('Sadece "tamam" yaz.'); tgSend_('✅ Gemini anahtarı kaydedildi ve çalışıyor. (Güvenlik için mesajını sildim.)'); }
        catch (e) { tgSend_('⚠️ Anahtar kaydedildi ama test başarısız: ' + esc_(e.message)); }
        break;
      }
      case '/ekle':
        if (!arg) { tgSend_('Kullanım: /ekle Rapor teslim yarın 14:00 #Okul !'); break; }
        tgAdd_(arg, withLock); break;
      default:
        if (cmd.charAt(0) === '/') tgSend_('Bu komutu tanımıyorum. /yardim yaz.');
        else tgAdd_(text, withLock);
    }
  } catch (e) {
    tgSend_('⚠️ ' + esc_(e.message || String(e)));
  }
}

function tgAdd_(text, withLock) {
  const t = withLock(function () { return quickAdd_(text); });
  let info = '➕ <b>Eklendi:</b> ' + esc_(t.title);
  const bits = [];
  if (t.date) bits.push('📅 ' + fmtLong_(t.date));
  if (t.time) bits.push('🕒 ' + t.time);
  if (t.category) bits.push('#' + esc_(t.category));
  if (t.priority === 1) bits.push('🔴 önemli');
  if (bits.length) info += '\n' + bits.join(' · ');
  tgSend_(info);
}

function sendDayList_(date, label) {
  const open = getTasks_().filter(function (t) { return !t.done; });
  const list = open.filter(function (t) { return t.date === date; }).sort(sortTasks_);
  const today = todayStr_();
  const overdue = date === today ? open.filter(function (t) { return t.date && t.date < today; }).sort(sortTasks_) : [];
  const L = ['📋 <b>' + label + '</b> — ' + fmtLong_(date)];
  const ids = [];
  let n = 0;
  if (!list.length) L.push('Görev yok. 🌿');
  list.forEach(function (t) { ids.push(t.id); L.push(taskLine_(t, ++n)); });
  if (overdue.length) {
    L.push('\n⚠️ <b>Gecikenler</b>');
    overdue.slice(0, 10).forEach(function (t) { ids.push(t.id); L.push(taskLine_(t, ++n, fmtShort_(t.date))); });
  }
  props_().setProperty('TG_LAST', JSON.stringify(ids));
  const kb = doneKeyboard_(list.concat(overdue));
  tgSend_(L.join('\n'), kb ? { reply_markup: kb } : null);
}

function sendWeekList_() {
  const today = todayStr_();
  const open = getTasks_().filter(function (t) { return !t.done && t.date && t.date >= today && t.date <= addDays_(today, 6); }).sort(sortTasks_);
  const L = ['🗓 <b>Önümüzdeki 7 gün</b>'];
  const ids = [];
  let n = 0;
  for (let i = 0; i < 7; i++) {
    const d = addDays_(today, i);
    const day = open.filter(function (t) { return t.date === d; });
    if (!day.length) continue;
    L.push('\n<b>' + (i === 0 ? 'Bugün' : i === 1 ? 'Yarın' : GUN[dow_(d)]) + '</b> · ' + fmtShort_(d));
    day.forEach(function (t) { ids.push(t.id); L.push(taskLine_(t, ++n)); });
  }
  if (!ids.length) L.push('Önümüzdeki hafta için tarihli görev yok.');
  props_().setProperty('TG_LAST', JSON.stringify(ids));
  tgSend_(L.join('\n'));
}

function gemini_(prompt, asJson) {
  const key = getProp_('GEMINI_KEY');
  if (!key) throw new Error('Gemini API anahtarı girilmemiş (Ayarlar > Gemini).');
  let model = getProp_('GEMINI_MODEL') || 'gemini-flash-latest';
  let r = geminiCall_(model, key, prompt, asJson);
  if (r.code === 404 || (r.code === 400 && /model/i.test(r.body))) {
    const alt = pickModel_(key);
    if (alt && alt !== model) {
      model = alt;
      props_().setProperty('GEMINI_MODEL', alt);
      r = geminiCall_(model, key, prompt, asJson);
    }
  }
  if (r.code !== 200) {
    let msg = r.body;
    try { msg = JSON.parse(r.body).error.message; } catch (e) { }
    throw new Error('Gemini hatası (' + r.code + '): ' + String(msg).slice(0, 300));
  }
  const j = JSON.parse(r.body);
  const parts = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
  const text = parts.filter(function (p) { return !p.thought; }).map(function (p) { return p.text || ''; }).join('').trim();
  if (!text) throw new Error('Gemini boş yanıt döndürdü.');
  if (asJson) return JSON.parse(text.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, ''));
  return text.replace(/\*\*/g, '').replace(/^#+\s*/gm, '').replace(/^\s*[\*\-]\s+/gm, '• ');
}

function geminiCall_(model, key, prompt, asJson) {
  const body = { contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { temperature: 0.7 } };
  if (asJson) body.generationConfig.responseMimeType = 'application/json';
  const res = UrlFetchApp.fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', {
    method: 'post', contentType: 'application/json', headers: { 'x-goog-api-key': key },
    payload: JSON.stringify(body), muteHttpExceptions: true
  });
  return { code: res.getResponseCode(), body: res.getContentText() };
}

function pickModel_(key) {
  try {
    const res = UrlFetchApp.fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', {
      headers: { 'x-goog-api-key': key }, muteHttpExceptions: true
    });
    const models = (JSON.parse(res.getContentText()).models || [])
      .filter(function (m) { return (m.supportedGenerationMethods || []).indexOf('generateContent') >= 0; })
      .map(function (m) { return m.name.replace(/^models\//, ''); })
      .filter(function (n) { return /flash/.test(n) && !/(image|tts|audio|live|lite|embedding|exp)/.test(n); });
    const ver = function (n) { const m = n.match(/(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : 0; };
    models.sort(function (a, b) {
      const pa = /preview/.test(a) ? 1 : 0, pb = /preview/.test(b) ? 1 : 0;
      if (pa !== pb) return pa - pb;
      return ver(b) - ver(a);
    });
    return models[0] || '';
  } catch (e) { return ''; }
}

function ctxText_(c) {

      (t.subtasks && t.subtasks.length ? ' [alt adım ' + t.subtasks.filter(function (s) { return s.d; }).length + '/' + t.subtasks.length + ']' : '');

  return 'Bugünün görevleri:\n' + (c.todays.map(line).join('\n') || '(yok)') +

function aiBreakdown_(d) {
  const today = todayStr_();
  const date = validDate_(d.date);
  const prompt = 'Bir görevi uygulanabilir, somut alt adımlara böl. Bugün: ' + today + ' (' + GUN[dow_(today)] + ').\n' +
    'Görev: ' + String(d.title || '').slice(0, 300) + '\n' +

    '3 ile 8 arası adım üret. Her adıma bugünden ' + (date ? 'son tarihe' : '14 gün sonrasına') + ' kadar mantıklı sırayla dağıtılmış bir tarih (YYYY-MM-DD) ve tahmini süre (dakika) ver. ' +
    (date ? 'Son adım en geç son tarihten bir gün önce bitsin (mümkünse). ' : '') +

  const r = gemini_(prompt, true);

  if (!steps.length) throw new Error('Gemini adım üretemedi, tekrar dene.');

/* =================================================================
 *  HIZLI EKLEME AYRIŞTIRICI  ("Rapor yarın 14:00 #Okul !")
 * ================================================================= */

function parseQuick_(text, today) {
  let s = ' ' + String(text || '').replace(/\s+/g, ' ').trim() + ' ';
  const out = { date: '', time: '', priority: 2, category: '', title: '' };
  const SUF = "(?:['’][a-zçğıöşü]+)?";
  const take = function (re, fn) {
    const m = s.match(re);
    if (!m) return false;
    if (fn(m) === false) return false;
    s = s.replace(m[0], ' ');
    return true;
  };
  const pad = function (n) { return ('0' + n).slice(-2); };

  take(/\s#([^\s#]+)/, function (m) { out.category = m[1]; });
  take(/\s?!+(?=\s)/, function () { out.priority = 1; });

  const setTime = function (m) {
    const h = +m[1], mi = +m[2];
    if (h > 23 || mi > 59) return false;
    out.time = pad(h) + ':' + pad(mi);
  };
  take(new RegExp('\\s(?:saat\\s*)?(\\d{1,2}):(\\d{2})' + SUF + '(?=\\s)', 'i'), setTime);
  if (!out.time) take(new RegExp('\\ssaat\\s*(\\d{1,2})\\.(\\d{2})' + SUF + '(?=\\s)', 'i'), setTime);
  if (!out.time) take(new RegExp('\\ssaat\\s*(\\d{1,2})' + SUF + '(?=\\s)', 'i'), function (m) {
    if (+m[1] > 23) return false;
    out.time = pad(+m[1]) + ':00';
  });

  take(new RegExp('\\s(\\d{1,2})[./](\\d{1,2})(?:[./](\\d{2,4}))?' + SUF + '(?=\\s)'), function (m) {
    const d = +m[1], mo = +m[2];
    if (d < 1 || d > 31 || mo < 1 || mo > 12) return false;
    let y = m[3] ? +m[3] : +today.slice(0, 4);
    if (y < 100) y += 2000;
    let ds = y + '-' + pad(mo) + '-' + pad(d);
    if (!m[3] && ds < today) ds = (y + 1) + '-' + pad(mo) + '-' + pad(d);
    out.date = validDate_(ds);
    if (!out.date) return false;
  });

  if (!out.date) {
    const rel = [
      [/\s(?:bugün|bugun)(?=\s)/i, 0],
      [/\s(?:yarın|yarin)(?:a|ki)?(?=\s)/i, 1],
      [/\s(?:öbür gün|obur gun|öbürgün|ertesi gün)(?=\s)/i, 2],
      [/\s(?:haftaya|gelecek hafta|seneye hafta)(?=\s)/i, 7]
    ];
    for (let i = 0; i < rel.length && !out.date; i++) {
      take(rel[i][0], function () { out.date = addDays_(today, rel[i][1]); });
    }
  }
  if (!out.date) take(/\s(\d{1,3})\s*gün\s*sonra(?=\s)/i, function (m) { out.date = addDays_(today, +m[1]); });
  if (!out.date) {
    const days = [['pazartesi', 1], ['salı', 2], ['sali', 2], ['çarşamba', 3], ['carsamba', 3], ['perşembe', 4], ['persembe', 4],
      ['cumartesi', 6], ['cuma', 5], ['pazar', 0]];
    for (let i = 0; i < days.length && !out.date; i++) {
      take(new RegExp('\\s' + days[i][0] + "(?:ya|ye|a|e|['’][a-zçğıöşü]+)?(?=\\s)", 'i'), function () {
        const diff = (days[i][1] - dow_(today) + 7) % 7;
        out.date = addDays_(today, diff);
      });
    }
  }
  if (out.time && !out.date) out.date = today;

  out.title = s.replace(/\s+/g, ' ').trim().replace(/^[,;:\-–]+|[,;:\-–]+$/g, '').trim();
  out.title = out.title.charAt(0).toLocaleUpperCase('tr') + out.title.slice(1);
  return out;
}

  const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));

}

  const m = String(v || '').match(/^(\d{1,2}):(\d{2})/);

  return ('0' + m[1]).slice(-2) + ':' + m[2];
}
function addDays_(ds, n) { const d = new Date(ds + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dow_(ds) { return new Date(ds + 'T00:00:00Z').getUTCDay(); }
function diffDays_(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5); }
function addMonths_(ds, n) {
  const p = ds.split('-').map(Number);

}

  const C=2*Math.PI*28;

      <div><h2>${greet()}${name}!</h2><p>${fmtLong(t)} · ${todays.length+overdue.length?`${todays.length+overdue.length} işin var`:'Bugün boşsun 🌿'}</p></div>
      <div class="stats"><div><b>${doneN}</b><span>bitti</span></div><div><b>${todays.length}</b><span>kalan</span></div><div><b>${overdue.length}</b><span>geciken</span></div></div>
    </div>

    ${section('Yaklaşan (7 gün)',upcoming)}
    ${undated.length?section('Tarihsiz',undated.slice(0,8)):''}
    ${doneToday.length?`<div class="sec" style="cursor:pointer" data-act="showDone">Bugün tamamlananlar<span class="n">${doneToday.length}</span><span style="margin-left:auto">${UI.showDone?'▾':'▸'}</span></div>${UI.showDone?list(doneToday):''}`:''}
  `;
  const right=`
    <div class="card">
      <h3>🤖 Gemini ile günümü planla</h3>
      ${S.settings.geminiSet?`<button class="btn ai" data-act="aiPlan" ${UI.aiPlanBusy?'disabled':''}>${UI.aiPlanBusy?'<span class="spin"></span> Düşünüyor…':'✨ Plan oluştur'}</button>`
        :`<p style="margin:0;font-size:13px;color:var(--muted)">Gemini API anahtarını <a href="#" data-act="go" data-v="settings">Ayarlar</a>’dan ekleyince gününü senin için planlar.</p>`}
      ${UI.aiPlan?`<div class="ai-out">${h(UI.aiPlan)}</div>`:''}
    </div>
    <div class="card">
      <h3>🔁 Bugünün alışkanlıkları<a class="r" href="#" data-act="go" data-v="habits">Tümü</a></h3>
      ${habitsToday.length?`<div class="hchips">${habitsToday.map(x=>{const on=x.log.includes(t);return `<button class="hchip ${on?'on':''}" data-act="habit" data-id="${x.id}" data-d="${t}">${h(x.emoji)} ${h(x.name)}${on?' ✓':''}</button>`;}).join('')}</div>`
        :`<p style="margin:0;font-size:13px;color:var(--muted)">Henüz alışkanlık yok. <a href="#" data-act="go" data-v="habits">Ekle</a></p>`}
    </div>
    ${focusCard(todays.concat(overdue))}
  `;
  return header('Bugün','',`<button class="iconbtn" data-act="refresh" title="Yenile">⟳</button>`)+`<div class="cols"><div>${left}</div><div>${right}</div></div>`;
}
